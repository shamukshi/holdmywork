<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HoldMyWork Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .card {
            background: white;
            width: 420px;
            padding: 45px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 10px;
            color: #222;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .download-btn {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 10px;
            background: #111;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>HoldMyWork</h1>

        <p>Your automation tool is ready.</p>

        <a
            class="download-btn"
            href="https://api.holdmywork.com/download"
            download>
            ⬇ Download Tool
        </a>

    </div>

</body>
</html>
