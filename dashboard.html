<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HoldMyWork Dashboard</title>

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            position: relative; /* for absolute positioning of the extra button */
        }

        /* ---- top-right extra download button ---- */
        .top-right-download {
            position: fixed;
            top: 24px;
            right: 28px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #111;
            color: #fff;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            transition: 0.25s;
            border: none;
            cursor: pointer;
        }

        .top-right-download:hover {
            background: #222;
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
        }

        .top-right-download:active {
            transform: translateY(0);
        }

        .top-right-download .icon {
            font-size: 18px;
        }

        /* ---- existing card ---- */
        .card {
            background: white;
            width: 430px;
            padding: 45px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 10px;
            background: #111;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.3s;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .download-btn {
            background: #111;
        }

        .download-btn.ready {
            background: #16a34a;
        }

        .status {
            margin-top: 18px;
            font-size: 14px;
            min-height: 30px;
            color: #666;
        }

        .status.error {
            color: #dc3636;
        }

        .status.success {
            color: #16a34a;
        }

        .hidden {
            display: none;
        }

        /* small responsive tweak */
        @media (max-width: 520px) {
            .top-right-download {
                top: 16px;
                right: 16px;
                padding: 8px 16px;
                font-size: 13px;
                border-radius: 30px;
            }
            .card {
                width: 90%;
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <!-- ⬇⬇⬇  NEW: top-right download button for hmw.zip  ⬇⬇⬇ -->
    <a
        id="top-download-btn"
        class="top-right-download"
        href="hmw.zip"
        download="hmw.zip"
        title="Download hmw.zip"
    >
        <span class="icon">⬇</span> hmw.zip
    </a>
    <!-- ⬆⬆⬆  END NEW BUTTON  ⬆⬆⬆ -->

    <div class="card">

        <h1>HoldMyWork</h1>

        <p id="subtitle">Pay ₹100 to unlock your download.</p>

        <!-- Pay Button (visible initially) -->
        <button id="pay-button" class="btn">
            💳 Click here to Pay ₹100
        </button>

        <!-- Download Button (hidden until payment verified) -->
        <a
            id="download-button"
            class="btn download-btn ready hidden"
            href="https://api.holdmywork.com/download"
            download>
            ⬇ Download Tool
        </a>

        <div id="status" class="status"></div>

    </div>

    <script>
        // ================================================
        // CONFIG
        // ================================================

        // Your Cloudflare Worker API base
        const API_BASE = "https://api.holdmywork.com";

        // Razorpay public key ID (safe to expose)
        const RAZORPAY_KEY_ID = "rzp_test_TezJSZDm1DT6Kt";

        // Price in paise (₹1 = 100 paise — Razorpay minimum)
        const AMOUNT_PAISE = 100;

        // ================================================
        // ELEMENTS
        // ================================================

        const payButton = document.getElementById("pay-button");
        const downloadButton = document.getElementById("download-button");
        const statusEl = document.getElementById("status");
        const subtitleEl = document.getElementById("subtitle");

        // (New top-right button is a plain <a> — no extra JS needed)

        // ================================================
        // HELPERS
        // ================================================

        function setStatus(message, type = "") {
            statusEl.textContent = message;
            statusEl.className = "status" + (type ? " " + type : "");
        }

        function unlockDownload() {
            // Hide pay button, show download button
            payButton.classList.add("hidden");
            downloadButton.classList.remove("hidden");

            subtitleEl.textContent = "Payment successful! Your download is ready.";
            setStatus("✅ Payment verified", "success");
        }

        // ================================================
        // PAYMENT FLOW
        // ================================================

        payButton.addEventListener("click", async () => {

            setStatus("Creating order...");
            payButton.disabled = true;

            try {
                // -------- STEP 1: Create order on backend --------
                const orderResponse = await fetch(
                    `${API_BASE}/api/create-order`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            amount: AMOUNT_PAISE,
                            currency: "INR",
                            receipt: `hmw_${Date.now()}`
                        })
                    }
                );

                const orderData = await orderResponse.json();

                if (!orderData.success) {
                    throw new Error(orderData.error || "Failed to create order");
                }

                // -------- STEP 2: Open Razorpay modal --------
                const options = {
                    key: RAZORPAY_KEY_ID,
                    amount: orderData.amount,
                    currency: orderData.currency,
                    name: "HoldMyWork",
                    description: "Download access",
                    order_id: orderData.order_id,

                    handler: async function (response) {
                        // -------- STEP 3: Verify signature --------
                        setStatus("Verifying payment...");

                        try {
                            const verifyResponse = await fetch(
                                `${API_BASE}/api/verify-payment`,
                                {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({
                                        razorpay_order_id: response.razorpay_order_id,
                                        razorpay_payment_id: response.razorpay_payment_id,
                                        razorpay_signature: response.razorpay_signature
                                    })
                                }
                            );

                            const verifyData = await verifyResponse.json();

                            if (verifyData.success) {
                                unlockDownload();
                            } else {
                                setStatus(
                                    "❌ Payment verification failed. Contact support.",
                                    "error"
                                );
                                payButton.disabled = false;
                            }
                        } catch (err) {
                            setStatus(`❌ Verification error: ${err.message}`, "error");
                            payButton.disabled = false;
                        }
                    },

                    modal: {
                        ondismiss: function () {
                            setStatus("Payment cancelled.");
                            payButton.disabled = false;
                        }
                    },

                    theme: {
                        color: "#111111"
                    }
                };

                const rzp = new Razorpay(options);

                // Payment failure event
                rzp.on("payment.failed", function (response) {
                    setStatus(
                        `❌ Payment failed: ${response.error.description}`,
                        "error"
                    );
                    payButton.disabled = false;
                });

                rzp.open();

            } catch (err) {
                setStatus(`❌ ${err.message}`, "error");
                payButton.disabled = false;
            }
        });
    </script>

</body>
</html>
