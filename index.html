<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HoldMyWork · OHLC</title>
    <!-- Lightweight Charts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f14;
            color: #d1d9e6;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px 20px 20px 20px;
            overflow: hidden;
        }

        .app-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 16px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .brand h1 {
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            color: #eef3fa;
            background: linear-gradient(145deg, #eef3fa 0%, #b0c8e0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand small {
            font-size: 0.9rem;
            font-weight: 300;
            color: #8b9bb5;
            margin-left: 4px;
            letter-spacing: 0.2px;
            -webkit-text-fill-color: #8b9bb5;
        }

        .sub-message {
            font-size: 0.95rem;
            color: #a2b7d0;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #2a3440;
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }

        .chart-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .info-badge {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 18px;
            font-size: 0.75rem;
            color: #8499b3;
            background: #121b24;
            padding: 4px 16px 4px 14px;
            border-radius: 40px;
            border: 1px solid #25323f;
        }

        .info-badge span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .info-badge .num {
            color: #d6e5f8;
            font-weight: 500;
        }

        .chart-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            background: #0d131b;
            border-radius: 20px;
            border: 1px solid #202b36;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            padding: 8px;
            position: relative;
            transition: all 0.1s;
        }

        #chart-container {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            background: #0d131b;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px 12px 12px 12px;
            }
            .brand h1 {
                font-size: 1.4rem;
            }
            .sub-message {
                font-size: 0.75rem;
                padding: 2px 10px;
            }
            .info-badge {
                font-size: 0.65rem;
                padding: 2px 10px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1e2833;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a5068;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <h1>holdmywork</h1>
            <small>⚡</small>
        </div>
        <div class="sub-message">
            Taaake care of my work while I go do something else.
        </div>
    </header>

    <div class="chart-controls">
        <div class="info-badge" id="infoBadge">
            <span>📄 <span class="num" id="candleCount">—</span> candles</span>
            <span>📅 <span id="dateRange">—</span></span>
            <span id="loadStatus" style="color:#8fb0d0;">⏳ loading…</span>
        </div>
    </div>

    <div class="chart-wrapper">
        <div id="chart-container"></div>
    </div>

    <script>
        (function() {
            "use strict";

            console.log('Lightweight Charts loaded:', typeof LightweightCharts);

            const container = document.getElementById('chart-container');
            const candleCountEl = document.getElementById('candleCount');
            const dateRangeEl = document.getElementById('dateRange');
            const loadStatusEl = document.getElementById('loadStatus');

            let chart = null;
            let candlestickSeries = null;

            // ---------- column detection ----------
            function findColumns(headers) {
                const lowerMap = {};
                headers.forEach(h => { lowerMap[h.trim().toLowerCase()] = h; });

                const dateCol = lowerMap['date'] || lowerMap['timestamp'] || lowerMap['time'] || lowerMap['datetime'] ||
                    null;
                const openCol = lowerMap['open_norm'] || lowerMap['open'] || lowerMap['open price'] || null;
                const highCol = lowerMap['high_norm'] || lowerMap['high'] || lowerMap['high price'] || null;
                const lowCol = lowerMap['low_norm'] || lowerMap['low'] || lowerMap['low price'] || null;
                const closeCol = lowerMap['close_norm'] || lowerMap['close'] || lowerMap['close price'] || lowerMap[
                    'last'] || null;

                return { dateCol, openCol, highCol, lowCol, closeCol };
            }

            function parseExcelDate(val) {
                if (typeof val === 'number') {
                    const epoch = new Date(1899, 11, 30);
                    return new Date(epoch.getTime() + val * 86400000);
                }
                if (typeof val === 'string') {
                    const d = new Date(val);
                    if (!isNaN(d.getTime())) return d;
                    const trimmed = val.trim();
                    const ms = Date.parse(trimmed);
                    if (!isNaN(ms)) return new Date(ms);
                }
                return null;
            }

            function toChartTime(dateObj) {
                if (!dateObj || isNaN(dateObj.getTime())) return null;
                return Math.floor(dateObj.getTime() / 1000);
            }

            // ---------- load Excel ----------
            async function loadExcel() {
                try {
                    loadStatusEl.textContent = '⏳ reading…';
                    
                    const response = await fetch('data/ohlc.xlsx');
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: Could not load data/ohlc.xlsx`);
                    }
                    
                    const arrayBuffer = await response.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: false });
                    
                    // Look for "tab_1" specifically
                    let sheetName = 'tab_1';
                    if (!workbook.SheetNames.includes(sheetName)) {
                        sheetName = workbook.SheetNames[0];
                    }
                    
                    const firstSheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: null });

                    if (!rows || rows.length === 0) {
                        throw new Error('No data rows found in sheet: ' + sheetName);
                    }

                    const headers = Object.keys(rows[0]);
                    const { dateCol, openCol, highCol, lowCol, closeCol } = findColumns(headers);

                    if (!dateCol || !openCol || !highCol || !lowCol || !closeCol) {
                        throw new Error(
                            `Could not detect OHLC columns. Found: ${headers.join(', ')}`
                        );
                    }

                    const parsed = [];
                    for (const row of rows) {
                        const rawDate = row[dateCol];
                        const open = parseFloat(row[openCol]);
                        const high = parseFloat(row[highCol]);
                        const low = parseFloat(row[lowCol]);
                        const close = parseFloat(row[closeCol]);

                        if (rawDate === undefined || rawDate === null || rawDate === '') continue;
                        if ([open, high, low, close].some(v => isNaN(v) || !isFinite(v))) continue;

                        const dateObj = parseExcelDate(rawDate);
                        if (!dateObj || isNaN(dateObj.getTime())) continue;

                        const timeSec = toChartTime(dateObj);
                        if (timeSec === null) continue;

                        const exists = parsed.some(d => d.time === timeSec);
                        if (exists) continue;

                        parsed.push({
                            time: timeSec,
                            open: open,
                            high: high,
                            low: low,
                            close: close,
                            _date: dateObj
                        });
                    }

                    if (parsed.length === 0) {
                        throw new Error('No valid OHLC rows after parsing.');
                    }

                    parsed.sort((a, b) => a.time - b.time);
                    return parsed;
                } catch (err) {
                    console.error('Excel load error:', err);
                    loadStatusEl.textContent = `⚠️ ${err.message}`;
                    loadStatusEl.style.color = '#e6b88a';
                    return null;
                }
            }

            // ---------- render chart ----------
            function renderChart(data) {
                if (!data || data.length === 0) {
                    loadStatusEl.textContent = '⚠️ no data';
                    return;
                }

                console.log('Rendering', data.length, 'candles');

                if (chart) {
                    chart.remove();
                    chart = null;
                    candlestickSeries = null;
                }

                // Check if LightweightCharts is available
                if (typeof LightweightCharts === 'undefined') {
                    console.error('LightweightCharts library not loaded!');
                    loadStatusEl.textContent = '⚠️ Chart library not loaded';
                    loadStatusEl.style.color = '#e6b88a';
                    return;
                }

                chart = LightweightCharts.createChart(container, {
                    layout: {
                        background: { color: '#0d131b' },
                        textColor: '#b2c9e0',
                    },
                    grid: {
                        vertLines: { color: '#1f2b36' },
                        horzLines: { color: '#1f2b36' },
                    },
                    crosshair: {
                        mode: LightweightCharts.CrosshairMode.Normal,
                        vertLine: {
                            color: '#4d6a89',
                            width: 1,
                            style: LightweightCharts.LineStyle.Dashed,
                        },
                        horzLine: {
                            color: '#4d6a89',
                            width: 1,
                            style: LightweightCharts.LineStyle.Dashed,
                        },
                    },
                    rightPriceScale: {
                        borderColor: '#2a3a4a',
                        scaleMargins: { top: 0.05, bottom: 0.05 },
                    },
                    timeScale: {
                        borderColor: '#2a3a4a',
                        timeVisible: true,
                        secondsVisible: false,
                        tickMarkFormatter: (time, tickMarkType, locale) => {
                            const date = new Date(time * 1000);
                            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                        },
                    },
                    handleScroll: { mouseWheel: true, pressedMouseMove: true },
                    handleScale: { mouseWheel: true, pinch: true },
                    width: container.clientWidth,
                    height: container.clientHeight,
                });

                console.log('Chart created successfully');

                // Traditional red and green candle colors
                candlestickSeries = chart.addCandlestickSeries({
                    upColor: '#26a69a',        // Green for up candles
                    downColor: '#ef5350',      // Red for down candles
                    borderUpColor: '#26a69a',  // Green border
                    borderDownColor: '#ef5350',// Red border
                    wickUpColor: '#26a69a',    // Green wick
                    wickDownColor: '#ef5350',  // Red wick
                });

                const chartData = data.map(d => ({
                    time: d.time,
                    open: d.open,
                    high: d.high,
                    low: d.low,
                    close: d.close,
                }));
                candlestickSeries.setData(chartData);

                candleCountEl.textContent = data.length;
                if (data.length > 0) {
                    const first = new Date(data[0].time * 1000);
                    const last = new Date(data[data.length - 1].time * 1000);
                    dateRangeEl.textContent = `${formatDate(first)} → ${formatDate(last)}`;
                }

                // Fit all data
                chart.timeScale().fitContent();

                const resizeObserver = new ResizeObserver(() => {
                    if (chart) {
                        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
                    }
                });
                resizeObserver.observe(container);

                loadStatusEl.textContent = '✅ ready';
                loadStatusEl.style.color = '#8fb0d0';
            }

            function formatDate(date) {
                return date.toISOString().slice(0, 10);
            }

            // ---------- init ----------
            async function init() {
                const data = await loadExcel();
                if (data && data.length > 0) {
                    renderChart(data);
                } else {
                    loadStatusEl.textContent = '⚠️ no data loaded';
                    loadStatusEl.style.color = '#e6b88a';
                }
            }

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (chart) {
                        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
                    }
                }, 80);
            });

            init();
        })();
    </script>
</body>
</html>
