<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>holdmyword · automate & build</title>
  <!-- Font & basic styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d1117;  /* GitHub dark background */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 2rem;
      padding: 3rem 2.5rem;
      max-width: 820px;
      width: 100%;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.8);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      text-align: center;
    }

    .card:hover {
      transform: scale(1.01);
      box-shadow: 0 28px 48px -16px rgba(0, 0, 0, 0.9);
      border-color: #58a6ff40;
    }

    /* Octocat vibe – subtle decoration */
    .gh-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #21262d;
      border-radius: 60px;
      padding: 0.6rem 1.4rem;
      margin-bottom: 2rem;
      border: 1px solid #30363d;
      color: #8b949e;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
      gap: 0.6rem;
    }

    .gh-icon svg {
      fill: #f0f6fc;
      width: 22px;
      height: 22px;
    }

    .gh-icon span {
      color: #c9d1d9;
    }

    h1 {
      font-size: 3.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(145deg, #f0f6fc 0%, #c9d1d9 80%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
      line-height: 1.1;
      word-break: break-word;
    }

    .highlight {
      background: linear-gradient(145deg, #58a6ff, #1f6feb);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    .subhead {
      font-size: 1.6rem;
      font-weight: 400;
      color: #8b949e;
      margin-bottom: 1.8rem;
      line-height: 1.4;
      border-bottom: 1px dashed #30363d;
      padding-bottom: 1.8rem;
    }

    .subhead strong {
      color: #e6edf3;
      font-weight: 600;
    }

    .tagline-box {
      background: #0d1117;
      border-radius: 60px;
      padding: 1.2rem 2rem;
      display: inline-block;
      border: 1px solid #30363d;
      margin-top: 0.4rem;
      margin-bottom: 1rem;
    }

    .tagline-box p {
      color: #c9d1d9;
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .tagline-box i {
      font-style: normal;
      background: #21262d;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      margin: 0 0.2rem;
      color: #f0f6fc;
      font-weight: 500;
    }

    .action-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.8rem 1.2rem;
      margin-top: 2.8rem;
      padding-top: 1.8rem;
      border-top: 1px solid #21262d;
    }

    .badge {
      background: #21262d;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      border: 1px solid #30363d;
      color: #8b949e;
      font-size: 0.9rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .badge:hover {
      border-color: #58a6ff;
      color: #f0f6fc;
      background: #1c2333;
    }

    .badge svg {
      width: 16px;
      height: 16px;
      fill: #8b949e;
    }

    .badge:hover svg {
      fill: #58a6ff;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 0.6rem 1.6rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: default;
      transition: 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-ghost:hover {
      background: #21262d;
      border-color: #58a6ff;
      color: #ffffff;
    }

    .btn-primary {
      background: #238636;
      border: 1px solid #2ea043;
      color: #ffffff;
      padding: 0.6rem 1.8rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: default;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: #2ea043;
      border-color: #3fb950;
      box-shadow: 0 0 12px #23863660;
    }

    .footer-note {
      margin-top: 2.2rem;
      color: #484f58;
      font-size: 0.8rem;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .footer-note span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .footer-note .dot {
      width: 4px;
      height: 4px;
      background: #30363d;
      border-radius: 50%;
    }

    /* responsive */
    @media (max-width: 600px) {
      .card {
        padding: 2rem 1.5rem;
      }
      h1 {
        font-size: 2.6rem;
      }
      .subhead {
        font-size: 1.2rem;
      }
      .tagline-box p {
        font-size: 1rem;
      }
      .action-grid {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-ghost, .btn-primary {
        justify-content: center;
      }
    }

    /* little animation */
    @keyframes soft-float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
      100% { transform: translateY(0px); }
    }

    .gh-icon {
      animation: soft-float 3s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- GitHub styled icon -->
    <div class="gh-icon">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <span>holdmyword</span>
    </div>

    <!-- main headline -->
    <h1>
      welcome to <span class="highlight">holdmyword</span>
    </h1>

    <!-- secondary message -->
    <div class="subhead">
      <strong>here you have fun</strong> building models to automate your tasks
    </div>

    <!-- tagline / fun badge -->
    <div class="tagline-box">
      <p>
        <i>🤖</i> · build · train · deploy · <i>⚡</i>
      </p>
    </div>

    <!-- action buttons – pure GitHub flavour (non functional, just for look) -->
    <div class="action-grid">
      <span class="badge">
        <svg viewBox="0 0 16 16"><path d="M8 1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h6zm0 1H2a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z"/><path d="M4.5 10.5h6.75a.75.75 0 0 1 0 1.5H4.5a.75.75 0 0 1 0-1.5zm2 2h6.75a.75.75 0 0 1 0 1.5H6.5a.75.75 0 0 1 0-1.5z"/></svg>
        automation-ready
      </span>
      <span class="badge">
        <svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zm0 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm.5 10.25V4.75a.75.75 0 0 0-1.5 0v6.5a.75.75 0 0 0 1.5 0z"/></svg>
        model playground
      </span>
      <span class="badge">
        <svg viewBox="0 0 16 16"><path d="M3.5 1.5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v11.086a1 1 0 0 1-.293.707l-2.5 2.5a1 1 0 0 1-1.414 0l-2.5-2.5A1 1 0 0 1 3.5 12.586V1.5z"/></svg>
        &nbsp;autoML
      </span>
      <span class="btn-ghost">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        star
      </span>
      <span class="btn-primary">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zm3.78 6.72a.75.75 0 0 0-1.06-1.06L6.5 9.94 4.28 7.72a.75.75 0 0 0-1.06 1.06l2.75 2.75a.75.75 0 0 0 1.06 0l4.75-4.75z"/></svg>
        build model
      </span>
    </div>

    <!-- footer / repo like -->
    <div class="footer-note">
      <span>⚙️ 0.1.0</span>
      <span class="dot"></span>
      <span>📦 12 models</span>
      <span class="dot"></span>
      <span>🧪 6 automations</span>
      <span class="dot"></span>
      <span>✨ holdmyword · 2026</span>
    </div>
  </div>
</body>
</html>
