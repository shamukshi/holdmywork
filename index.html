<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HoldMyWork · autopilot for your work</title>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f7fafd;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 1.5rem;
        }

        .card {
            max-width: 620px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            padding: 3rem 2.5rem;
            box-shadow:
                0 15px 35px -10px rgba(0, 20, 50, 0.1),
                0 0 0 1px rgba(0, 0, 0, 0.02);
            text-align: center;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0a2540;
            margin-bottom: 0.75rem;
            line-height: 1.2;
        }

        .tagline {
            font-size: 1.25rem;
            color: #425b76;
            margin-bottom: 2rem;
            font-weight: 400;
            line-height: 1.5;
        }

        .tagline strong {
            font-weight: 600;
            color: #0a2540;
        }

        .google-login {
            display: flex;
            justify-content: center;
        }

        #login-status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #425b76;
            min-height: 20px;
        }

        @media (max-width: 480px) {

            .card {
                padding: 2rem 1.5rem;
                border-radius: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .tagline {
                font-size: 1.05rem;
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>HoldMyWork</h1>

        <p class="tagline">
            ....…a placeeee where you can create an
            <strong>autopilot for your work</strong>
        </p>

        <!-- Google Sign-In -->
        <div class="google-login">

            <div id="g_id_onload"
                 data-client_id="697862826295-26p1ed6e250sb4515e4h8f2l389lfmpq.apps.googleusercontent.com"
                 data-callback="handleGoogleLogin">
            </div>

            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="signin_with"
                 data-shape="pill">
            </div>

        </div>

        <!-- Login status -->
        <div id="login-status"></div>

    </div>


    <script>

        async function handleGoogleLogin(response) {

            const status = document.getElementById("login-status");

            status.textContent = "Signing in...";

            try {

                const result = await fetch(
                    "https://api.holdmywork.com/auth/google",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({
                            credential: response.credential
                        })
                    }
                );

                const data = await result.json();

                if (!result.ok || !data.success) {
                    throw new Error("Login failed");
                }

                status.textContent =
                    "Welcome, " + data.name + "!";

                // Redirect to dashboard
                window.location.href = "/dashboard.html";

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Google login failed. Please try again.";
            }
        }

    </script>

</body>
</html>
