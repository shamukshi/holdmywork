<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HoldMyWork · OHLC + Zoom</title>
    <!-- Plotly CDN -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f14;
            color: #d1d9e6;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px 20px 20px 20px;
            overflow: hidden;
        }

        .app-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 16px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .brand h1 {
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            color: #eef3fa;
            background: linear-gradient(145deg, #eef3fa 0%, #b0c8e0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand small {
            font-size: 0.9rem;
            font-weight: 300;
            color: #8b9bb5;
            margin-left: 4px;
            letter-spacing: 0.2px;
            -webkit-text-fill-color: #8b9bb5;
        }

        .sub-message {
            font-size: 0.95rem;
            color: #a2b7d0;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #2a3440;
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }

        .chart-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .info-badge {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 18px;
            font-size: 0.75rem;
            color: #8499b3;
            background: #121b24;
            padding: 4px 16px 4px 14px;
            border-radius: 40px;
            border: 1px solid #25323f;
        }

        .info-badge span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .info-badge .num {
            color: #d6e5f8;
            font-weight: 500;
        }

        .zoom-btn {
            background: #1e2a36;
            border: 1px solid #3a5068;
            color: #d1d9e6;
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            letter-spacing: 0.3px;
        }
        .zoom-btn:hover {
            background: #2a3a4a;
            border-color: #5a7a9a;
            color: white;
        }
        .zoom-btn.active {
            background: #2d4b5e;
            border-color: #6a9fc0;
            box-shadow: 0 0 12px rgba(70, 150, 220, 0.3);
        }
        .zoom-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .chart-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            background: #0d131b;
            border-radius: 20px;
            border: 1px solid #202b36;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            padding: 8px;
            position: relative;
            transition: all 0.1s;
        }

        #chart-container {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            background: #0d131b;
        }

        /* subtle instruction when zoom tool is active */
        .zoom-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2633ee;
            backdrop-filter: blur(6px);
            padding: 6px 18px;
            border-radius: 60px;
            border: 1px solid #3a5a7a;
            font-size: 0.8rem;
            color: #b8d0e8;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .zoom-hint.show {
            opacity: 1;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px 12px 12px 12px;
            }
            .brand h1 {
                font-size: 1.4rem;
            }
            .sub-message {
                font-size: 0.75rem;
                padding: 2px 10px;
            }
            .info-badge {
                font-size: 0.65rem;
                padding: 2px 10px;
            }
            .zoom-btn {
                font-size: 0.75rem;
                padding: 4px 12px 4px 8px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1e2833;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a5068;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <h1>holdmywork</h1>
            <small>⚡</small>
        </div>
        <div class="sub-message">
            Tke care of my work while I go do something else.
        </div>
    </header>

    <div class="chart-controls">
        <div class="info-badge" id="infoBadge">
            <span>📄 <span class="num" id="candleCount">—</span> candles</span>
            <span>📅 <span id="dateRange">—</span></span>
            <span id="loadStatus" style="color:#8fb0d0;">⏳ loading…</span>
        </div>
        <button class="zoom-btn" id="zoomBtn" title="Click to enable zoom box, then drag on chart to zoom">
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" />
                <line x1="16" y1="16" x2="22" y2="22" />
                <rect x="2" y="2" width="18" height="18" rx="2" stroke-dasharray="4 2" opacity="0.5" />
            </svg>
            <span>Magnify</span>
        </button>
    </div>

    <div class="chart-wrapper" id="chartWrapper">
        <div id="chart-container"></div>
        <div class="zoom-hint" id="zoomHint">✧ Drag a rectangle to zoom in</div>
    </div>

    <script>
        (function() {
            "use strict";

            const container = document.getElementById('chart-container');
            const candleCountEl = document.getElementById('candleCount');
            const dateRangeEl = document.getElementById('dateRange');
            const loadStatusEl = document.getElementById('loadStatus');
            const zoomBtn = document.getElementById('zoomBtn');
            const zoomHint = document.getElementById('zoomHint');

            let ohlcData = [];
            let isZoomActive = false;

            // ---------- column detection ----------
            function findColumns(headers) {
                const lowerMap = {};
                headers.forEach(h => { lowerMap[h.trim().toLowerCase()] = h; });

                const dateCol = lowerMap['date'] || lowerMap['timestamp'] || lowerMap['time'] || lowerMap['datetime'] ||
                    null;
                const openCol = lowerMap['open_norm'] || lowerMap['open'] || lowerMap['open price'] || null;
                const highCol = lowerMap['high_norm'] || lowerMap['high'] || lowerMap['high price'] || null;
                const lowCol = lowerMap['low_norm'] || lowerMap['low'] || lowerMap['low price'] || null;
                const closeCol = lowerMap['close_norm'] || lowerMap['close'] || lowerMap['close price'] || lowerMap[
                    'last'] || null;

                return { dateCol, openCol, highCol, lowCol, closeCol };
            }

            function parseExcelDate(val) {
                if (typeof val === 'number') {
                    const epoch = new Date(1899, 11, 30);
                    return new Date(epoch.getTime() + val * 86400000);
                }
                if (typeof val === 'string') {
                    const d = new Date(val);
                    if (!isNaN(d.getTime())) return d;
                    const trimmed = val.trim();
                    const ms = Date.parse(trimmed);
                    if (!isNaN(ms)) return new Date(ms);
                }
                return null;
            }

            // ---------- load Excel ----------
            async function loadExcel() {
                try {
                    loadStatusEl.textContent = '⏳ reading…';
                    
                    const response = await fetch('data/ohlc.xlsx');
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: Could not load data/ohlc.xlsx`);
                    }
                    
                    const arrayBuffer = await response.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: false });
                    
                    let sheetName = 'tab_1';
                    if (!workbook.SheetNames.includes(sheetName)) {
                        sheetName = workbook.SheetNames[0];
                    }
                    
                    const firstSheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: null });

                    if (!rows || rows.length === 0) {
                        throw new Error('No data rows found in sheet: ' + sheetName);
                    }

                    const headers = Object.keys(rows[0]);
                    const { dateCol, openCol, highCol, lowCol, closeCol } = findColumns(headers);

                    if (!dateCol || !openCol || !highCol || !lowCol || !closeCol) {
                        throw new Error(
                            `Could not detect OHLC columns. Found: ${headers.join(', ')}`
                        );
                    }

                    const parsed = [];
                    for (const row of rows) {
                        const rawDate = row[dateCol];
                        const open = parseFloat(row[openCol]);
                        const high = parseFloat(row[highCol]);
                        const low = parseFloat(row[lowCol]);
                        const close = parseFloat(row[closeCol]);

                        if (rawDate === undefined || rawDate === null || rawDate === '') continue;
                        if ([open, high, low, close].some(v => isNaN(v) || !isFinite(v))) continue;

                        const dateObj = parseExcelDate(rawDate);
                        if (!dateObj || isNaN(dateObj.getTime())) continue;

                        const timeSec = Math.floor(dateObj.getTime() / 1000);
                        if (timeSec === null) continue;

                        const exists = parsed.some(d => d.time === timeSec);
                        if (exists) continue;

                        parsed.push({
                            time: timeSec,
                            open: open,
                            high: high,
                            low: low,
                            close: close,
                            date: dateObj
                        });
                    }

                    if (parsed.length === 0) {
                        throw new Error('No valid OHLC rows after parsing.');
                    }

                    parsed.sort((a, b) => a.time - b.time);
                    ohlcData = parsed;
                    return parsed;
                } catch (err) {
                    console.error('Excel load error:', err);
                    loadStatusEl.textContent = `⚠️ ${err.message}`;
                    loadStatusEl.style.color = '#e6b88a';
                    return null;
                }
            }

            // ---------- render chart with Plotly ----------
            function renderChart(data) {
                if (!data || data.length === 0) {
                    loadStatusEl.textContent = '⚠️ no data';
                    return;
                }

                console.log('Rendering', data.length, 'hourly candles');

                const hoverTexts = data.map(d => {
                    const dateStr = d.date.toLocaleDateString('en-US', { 
                        month: 'short', day: 'numeric', year: 'numeric' 
                    });
                    const timeStr = d.date.toLocaleTimeString('en-US', { 
                        hour: '2-digit', minute: '2-digit', hour12: false 
                    });
                    return `${dateStr} ${timeStr}`;
                });

                // x-axis date labels
                const dateTickVals = [];
                const dateTickTexts = [];
                let currentDateKey = '';
                for (let i = 0; i < data.length; i++) {
                    const d = data[i].date;
                    const dateKey = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                    if (dateKey !== currentDateKey) {
                        currentDateKey = dateKey;
                        dateTickVals.push(i);
                        const month = d.toLocaleString('en-US', { month: 'short' });
                        const day = d.getDate();
                        const yearShort = String(d.getFullYear()).slice(-2);
                        dateTickTexts.push(`${month} ${day}/${yearShort}`);
                    }
                }

                const indices = data.map((_, i) => i);

                const trace = {
                    type: 'candlestick',
                    x: indices,
                    open: data.map(d => d.open),
                    high: data.map(d => d.high),
                    low: data.map(d => d.low),
                    close: data.map(d => d.close),
                    increasing: { line: { color: '#26a69a' }, fillcolor: '#26a69a' },
                    decreasing: { line: { color: '#ef5350' }, fillcolor: '#ef5350' },
                    name: 'OHLC',
                    text: hoverTexts,
                    hovertemplate: '<b>%{text}</b><br>' +
                        'Open: %{open:.4f}<br>' +
                        'High: %{high:.4f}<br>' +
                        'Low: %{low:.4f}<br>' +
                        'Close: %{close:.4f}<extra></extra>'
                };

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#b2c9e0', family: 'system-ui, -apple-system, sans-serif' },
                    xaxis: {
                        title: { text: 'Date', font: { color: '#b2c9e0' } },
                        gridcolor: '#1f2b36',
                        zerolinecolor: '#1f2b36',
                        color: '#b2c9e0',
                        rangeslider: { visible: false },
                        tickmode: 'array',
                        tickvals: dateTickVals,
                        ticktext: dateTickTexts,
                        tickangle: -45,
                        showspikes: true,
                        spikemode: 'across',
                        spikethickness: 1,
                        spikecolor: '#4d6a89',
                        tickfont: { size: 10 },
                        range: [-0.5, indices.length - 0.5]
                    },
                    yaxis: {
                        title: { text: 'Price', font: { color: '#b2c9e0' } },
                        gridcolor: '#1f2b36',
                        zerolinecolor: '#1f2b36',
                        color: '#b2c9e0',
                        side: 'right'
                    },
                    margin: { l: 60, r: 20, t: 20, b: 80 },
                    hovermode: 'x unified',
                    showlegend: false,
                    dragmode: 'zoom',   // default: 'zoom' (pan+zoom via plotly)
                    modebar: {
                        bgcolor: 'rgba(13, 19, 27, 0.8)',
                        color: '#b2c9e0',
                        activecolor: '#6b8bb0'
                    }
                };

                const config = {
                    responsive: true,
                    displayModeBar: true,
                    modeBarButtonsToRemove: ['lasso2d', 'select2d', 'autoScale2d'],
                    displaylogo: false
                };

                Plotly.newPlot(container, [trace], layout, config);
                // store reference to layout for later zoom updates
                container._layout = layout;

                candleCountEl.textContent = data.length;
                if (data.length > 0) {
                    const first = data[0].date;
                    const last = data[data.length - 1].date;
                    dateRangeEl.textContent = `${formatDate(first)} → ${formatDate(last)}`;
                }

                loadStatusEl.textContent = '✅ ready';
                loadStatusEl.style.color = '#8fb0d0';
            }

            function formatDate(date) {
                return date.toISOString().slice(0, 10);
            }

            // ---------- ZOOM TOOL: draw bounding box & fit ----------
            function enableZoomTool() {
                if (isZoomActive) {
                    // disable
                    isZoomActive = false;
                    zoomBtn.classList.remove('active');
                    zoomHint.classList.remove('show');
                    // restore default dragmode
                    Plotly.relayout(container, { dragmode: 'zoom' });
                    return;
                }

                // activate
                isZoomActive = true;
                zoomBtn.classList.add('active');
                zoomHint.classList.add('show');

                // set dragmode to 'select' to let user draw a box (rectangular selection)
                Plotly.relayout(container, { dragmode: 'select' });

                // remove any existing selection event to avoid duplicates
                if (container._zoomHandler) {
                    container.removeListener('plotly_selected', container._zoomHandler);
                }

                // handler: when selection is made, zoom to that range
                const handler = function(eventData) {
                    if (!eventData || !eventData.range || !eventData.range.x || !eventData.range.y) {
                        // selection cleared or empty
                        return;
                    }
                    const xRange = eventData.range.x;
                    const yRange = eventData.range.y;
                    
                    // clamp to data bounds
                    const minX = 0;
                    const maxX = ohlcData.length - 1;
                    const x0 = Math.max(minX, Math.min(maxX, xRange[0]));
                    const x1 = Math.max(minX, Math.min(maxX, xRange[1]));
                    
                    // get price range from data to clamp y
                    let minY = Infinity, maxY = -Infinity;
                    for (const d of ohlcData) {
                        if (d.low < minY) minY = d.low;
                        if (d.high > maxY) maxY = d.high;
                    }
                    const y0 = Math.max(minY, Math.min(maxY, yRange[0]));
                    const y1 = Math.max(minY, Math.min(maxY, yRange[1]));

                    // only zoom if selection is meaningful
                    if (Math.abs(x1 - x0) < 0.5 || Math.abs(y1 - y0) < 0.01) {
                        // too small, ignore
                        return;
                    }

                    // apply zoom
                    Plotly.relayout(container, {
                        'xaxis.range': [x0, x1],
                        'yaxis.range': [y0, y1],
                        dragmode: 'select'  // keep in select mode for further zooms
                    });

                    // keep the tool active (stay in select mode)
                };

                container._zoomHandler = handler;
                container.on('plotly_selected', handler);

                // also handle click on background to reset zoom? not needed, user can double-click or use home button.
                // but we keep select mode.
            }

            // reset zoom to full range (double-click or home)
            function resetZoom() {
                if (!ohlcData || ohlcData.length === 0) return;
                const minX = 0;
                const maxX = ohlcData.length - 1;
                let minY = Infinity, maxY = -Infinity;
                for (const d of ohlcData) {
                    if (d.low < minY) minY = d.low;
                    if (d.high > maxY) maxY = d.high;
                }
                const padding = (maxY - minY) * 0.05;
                Plotly.relayout(container, {
                    'xaxis.range': [minX - 0.5, maxX + 0.5],
                    'yaxis.range': [minY - padding, maxY + padding],
                    dragmode: isZoomActive ? 'select' : 'zoom'
                });
            }

            // ---------- handle resize ----------
            function handleResize() {
                if (container && container.clientWidth > 0) {
                    Plotly.Plots.resize(container);
                }
            }

            // ---------- init ----------
            async function init() {
                const data = await loadExcel();
                if (data && data.length > 0) {
                    renderChart(data);
                    // after render, set initial y-range with some padding
                    let minY = Infinity, maxY = -Infinity;
                    for (const d of data) {
                        if (d.low < minY) minY = d.low;
                        if (d.high > maxY) maxY = d.high;
                    }
                    const padding = (maxY - minY) * 0.05;
                    Plotly.relayout(container, {
                        'yaxis.range': [minY - padding, maxY + padding]
                    });
                } else {
                    loadStatusEl.textContent = '⚠️ no data loaded';
                    loadStatusEl.style.color = '#e6b88a';
                }

                // zoom button toggle
                zoomBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    enableZoomTool();
                });

                // double-click on chart to reset zoom (if not in select mode, but we allow)
                container.addEventListener('dblclick', function(e) {
                    if (isZoomActive) {
                        // reset zoom but keep tool active
                        resetZoom();
                    } else {
                        // default double-click reset
                        resetZoom();
                    }
                });

                // also reset zoom when plotly 'autosize' or double-click on axis?
                // we handle via dblclick on container.
            }

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(handleResize, 200);
            });

            init();
        })();
    </script>
</body>
</html>
