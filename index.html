<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HoldMyWork · Pattern Matcher (BB)</title>
    <!-- Plotly & XLSX -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0f14;
            color: #d1d9e6;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px 20px 20px 20px;
            overflow: hidden;
        }
        .app-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 16px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .brand {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .brand h1 {
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            color: #eef3fa;
            background: linear-gradient(145deg, #eef3fa 0%, #b0c8e0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand small {
            font-size: 0.9rem;
            font-weight: 300;
            color: #8b9bb5;
            margin-left: 4px;
            -webkit-text-fill-color: #8b9bb5;
        }
        .sub-message {
            font-size: 0.95rem;
            color: #a2b7d0;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #2a3440;
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }
        .chart-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .info-badge {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 18px;
            font-size: 0.75rem;
            color: #8499b3;
            background: #121b24;
            padding: 4px 16px 4px 14px;
            border-radius: 40px;
            border: 1px solid #25323f;
        }
        .info-badge span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .info-badge .num {
            color: #d6e5f8;
            font-weight: 500;
        }
        .tools-group {
            display: flex;
            gap: 4px;
            align-items: center;
            background: #121b24;
            padding: 3px 6px;
            border-radius: 40px;
            border: 1px solid #25323f;
            flex-wrap: wrap;
        }
        .tool-btn {
            background: transparent;
            border: none;
            color: #8ba0b8;
            padding: 4px 8px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .tool-btn:hover {
            background: #1e2a36;
            color: #c0d4e8;
        }
        .tool-btn.active {
            background: #2d4b5e;
            color: #e8f4ff;
            box-shadow: 0 0 10px rgba(70, 150, 220, 0.2);
        }
        .tool-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .tool-divider {
            width: 1px;
            height: 22px;
            background: #2a3a4a;
            margin: 0 2px;
        }
        .chart-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            background: #0d131b;
            border-radius: 20px;
            border: 1px solid #202b36;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            padding: 8px;
            position: relative;
            transition: all 0.1s;
        }
        #chart-container {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            background: #0d131b;
        }
        .zoom-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2633ee;
            backdrop-filter: blur(6px);
            padding: 6px 18px;
            border-radius: 60px;
            border: 1px solid #3a5a7a;
            font-size: 0.8rem;
            color: #b8d0e8;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
            font-weight: 400;
            letter-spacing: 0.3px;
            z-index: 100;
        }
        .zoom-hint.show {
            opacity: 1;
        }
        .zoom-hint.success {
            border-color: #66ddaa;
            color: #66ddaa;
            background: #1a3a2aee;
        }
        .refresh-btn {
            background: #1e2a36;
            border: 1px solid #3a5068;
            color: #d1d9e6;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .refresh-btn:hover {
            background: #2a3a4a;
            border-color: #5a7a9a;
            color: white;
        }
        .refresh-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .find-btn {
            background: #1e4a5e;
            border: 1px solid #3a7a9a;
            color: #e8f4ff;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .find-btn:hover:not(:disabled) {
            background: #2a6a8a;
            border-color: #5a9aba;
            color: white;
        }
        .find-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .find-btn.active-find {
            background: #2a7a4a;
            border-color: #4aaa6a;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(74, 170, 106, 0.3); }
            50% { box-shadow: 0 0 20px rgba(74, 170, 106, 0.6); }
        }
        .bb-status {
            font-size: 0.7rem;
            color: #8ba0b8;
            padding: 2px 10px;
            background: #1a2430;
            border-radius: 20px;
            border: 1px solid #2a3a4a;
        }
        .bb-status.active {
            border-color: #ffaa66;
            color: #ffaa66;
        }
        .bb-status.done {
            border-color: #66ddaa;
            color: #66ddaa;
        }
        @media (max-width: 700px) {
            body {
                padding: 10px 12px 12px 12px;
            }
            .brand h1 {
                font-size: 1.4rem;
            }
            .sub-message {
                font-size: 0.75rem;
                padding: 2px 10px;
            }
            .info-badge {
                font-size: 0.65rem;
                padding: 2px 10px;
            }
            .tool-btn {
                font-size: 0.65rem;
                padding: 3px 6px;
            }
            .tool-btn svg {
                width: 14px;
                height: 14px;
            }
            .refresh-btn,
            .find-btn {
                font-size: 0.65rem;
                padding: 3px 8px;
            }
            .refresh-btn svg,
            .find-btn svg {
                width: 14px;
                height: 14px;
            }
            .bb-status {
                font-size: 0.6rem;
                padding: 1px 8px;
            }
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1e2833;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a5068;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <h1>holdmywork</h1>
            <small>⚡</small>
        </div>
        <div class="sub-message">
            kkk car of my work while I go do something else.
        </div>
    </header>

    <div class="chart-controls">
        <div class="info-badge" id="infoBadge">
            <span>📄 <span class="num" id="candleCount">—</span> candles</span>
            <span>📅 <span id="dateRange">—</span></span>
            <span id="loadStatus" style="color:#8fb0d0;">⏳ loading…</span>
        </div>

        <div class="tools-group" id="toolsGroup">
            <!-- Pan -->
            <button class="tool-btn active" id="panBtn" title="Pan mode">
                <svg viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l3 3 3-3M19 9l3 3-3 3M9 19l3 3 3-3M5 15l-3 3 3 3"/><circle cx="12" cy="12" r="2"/></svg>
                <span>Pan</span>
            </button>
            <div class="tool-divider"></div>

            <!-- BB (Bounding Box) -->
            <button class="tool-btn" id="bbBtn" title="Draw a BB (bounding box) over candles">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
                <span>BB</span>
            </button>
            
            <!-- BB Status -->
            <span class="bb-status" id="bbStatus">⏹ No BB</span>
            
            <div class="tool-divider"></div>

            <!-- Find Trend (pattern match) -->
            <button class="find-btn" id="findTrendBtn" disabled>🔍 Find Trend</button>

            <div class="tool-divider"></div>

            <!-- Reset to Home -->
            <button class="tool-btn" id="homeBtn" title="Reset to full view">
                <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10"/><rect x="10" y="14" width="4" height="4" rx="1"/></svg>
                <span>Home</span>
            </button>
            <div class="tool-divider"></div>

            <!-- Zoom In/Out -->
            <button class="tool-btn" id="zoomInBtn" title="Zoom in">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="22" y2="22"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                <span>+</span>
            </button>
            <button class="tool-btn" id="zoomOutBtn" title="Zoom out">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="22" y2="22"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                <span>−</span>
            </button>
            <div class="tool-divider"></div>

            <!-- Refresh -->
            <button class="refresh-btn" id="refreshBtn" title="Refresh everything">
                <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9"/></svg>
                <span>Refresh</span>
            </button>
        </div>
    </div>

    <div class="chart-wrapper" id="chartWrapper">
        <div id="chart-container"></div>
        <div class="zoom-hint" id="zoomHint">✧ Drag a rectangle over candles to define BB</div>
    </div>

    <script>
        (function() {
            "use strict";

            const container = document.getElementById('chart-container');
            const candleCountEl = document.getElementById('candleCount');
            const dateRangeEl = document.getElementById('dateRange');
            const loadStatusEl = document.getElementById('loadStatus');
            const zoomHint = document.getElementById('zoomHint');
            const bbStatus = document.getElementById('bbStatus');

            const panBtn = document.getElementById('panBtn');
            const bbBtn = document.getElementById('bbBtn');
            const findTrendBtn = document.getElementById('findTrendBtn');
            const homeBtn = document.getElementById('homeBtn');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const refreshBtn = document.getElementById('refreshBtn');

            let ohlcData = [];
            let activeTool = 'pan';
            let bbSelection = null;
            let matchResults = null;
            let isSelecting = false;

            // ---------- column detection ----------
            function findColumns(headers) {
                const lowerMap = {};
                headers.forEach(h => { lowerMap[h.trim().toLowerCase()] = h; });
                const dateCol = lowerMap['date'] || lowerMap['timestamp'] || lowerMap['time'] || lowerMap['datetime'] ||
                null;
                const openCol = lowerMap['open_norm'] || lowerMap['open'] || lowerMap['open price'] || null;
                const highCol = lowerMap['high_norm'] || lowerMap['high'] || lowerMap['high price'] || null;
                const lowCol = lowerMap['low_norm'] || lowerMap['low'] || lowerMap['low price'] || null;
                const closeCol = lowerMap['close_norm'] || lowerMap['close'] || lowerMap['close price'] || lowerMap[
                    'last'] || null;
                return { dateCol, openCol, highCol, lowCol, closeCol };
            }

            function parseExcelDate(val) {
                if (typeof val === 'number') {
                    const epoch = new Date(1899, 11, 30);
                    return new Date(epoch.getTime() + val * 86400000);
                }
                if (typeof val === 'string') {
                    const d = new Date(val);
                    if (!isNaN(d.getTime())) return d;
                    const trimmed = val.trim();
                    const ms = Date.parse(trimmed);
                    if (!isNaN(ms)) return new Date(ms);
                }
                return null;
            }

            // ---------- load Excel ----------
            async function loadExcel() {
                try {
                    loadStatusEl.textContent = '⏳ reading…';
                    const response = await fetch('data/ohlc.xlsx');
                    if (!response.ok) throw new Error(`HTTP ${response.status}: Could not load data/ohlc.xlsx`);
                    const arrayBuffer = await response.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: false });
                    let sheetName = 'tab_1';
                    if (!workbook.SheetNames.includes(sheetName)) sheetName = workbook.SheetNames[0];
                    const firstSheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: null });
                    if (!rows || rows.length === 0) throw new Error('No data rows found in sheet: ' + sheetName);
                    const headers = Object.keys(rows[0]);
                    const { dateCol, openCol, highCol, lowCol, closeCol } = findColumns(headers);
                    if (!dateCol || !openCol || !highCol || !lowCol || !closeCol) {
                        throw new Error(`Could not detect OHLC columns. Found: ${headers.join(', ')}`);
                    }
                    const parsed = [];
                    for (const row of rows) {
                        const rawDate = row[dateCol];
                        const open = parseFloat(row[openCol]);
                        const high = parseFloat(row[highCol]);
                        const low = parseFloat(row[lowCol]);
                        const close = parseFloat(row[closeCol]);
                        if (rawDate === undefined || rawDate === null || rawDate === '') continue;
                        if ([open, high, low, close].some(v => isNaN(v) || !isFinite(v))) continue;
                        const dateObj = parseExcelDate(rawDate);
                        if (!dateObj || isNaN(dateObj.getTime())) continue;
                        const timeSec = Math.floor(dateObj.getTime() / 1000);
                        if (timeSec === null) continue;
                        const exists = parsed.some(d => d.time === timeSec);
                        if (exists) continue;
                        parsed.push({
                            time: timeSec,
                            open: open,
                            high: high,
                            low: low,
                            close: close,
                            date: dateObj
                        });
                    }
                    if (parsed.length === 0) throw new Error('No valid OHLC rows after parsing.');
                    parsed.sort((a, b) => a.time - b.time);
                    ohlcData = parsed;
                    return parsed;
                } catch (err) {
                    console.error('Excel load error:', err);
                    loadStatusEl.textContent = `⚠️ ${err.message}`;
                    loadStatusEl.style.color = '#e6b88a';
                    return null;
                }
            }

            // ---------- Similarity (from Colab) ----------
            function calculateSimilarity(target, window) {
                const n = target.length;
                let sumAbs = 0;
                for (let i = 0; i < n; i++) {
                    sumAbs += Math.abs(target[i].open - window[i].open);
                    sumAbs += Math.abs(target[i].high - window[i].high);
                    sumAbs += Math.abs(target[i].low - window[i].low);
                    sumAbs += Math.abs(target[i].close - window[i].close);
                }
                const meanError = sumAbs / (n * 4);
                let minVal = Infinity,
                    maxVal = -Infinity;
                const all = [...target, ...window];
                for (const d of all) {
                    if (d.open < minVal) minVal = d.open;
                    if (d.high < minVal) minVal = d.high;
                    if (d.low < minVal) minVal = d.low;
                    if (d.close < minVal) minVal = d.close;
                    if (d.open > maxVal) maxVal = d.open;
                    if (d.high > maxVal) maxVal = d.high;
                    if (d.low > maxVal) maxVal = d.low;
                    if (d.close > maxVal) maxVal = d.close;
                }
                const dataRange = maxVal - minVal;
                if (dataRange === 0) return 100.0;
                const relativeError = meanError / dataRange;
                const similarity = Math.max(0, (1 - relativeError) * 100);
                return similarity;
            }

            function findMatchingPatterns(data, targetPattern, threshold = 80) {
                const nTarget = targetPattern.length;
                const nTotal = data.length;
                if (nTotal <= nTarget) return [];
                const matches = [];
                for (let i = 0; i <= nTotal - nTarget; i++) {
                    const window = data.slice(i, i + nTarget);
                    const sim = calculateSimilarity(targetPattern, window);
                    if (sim >= threshold) {
                        matches.push({
                            startIdx: i,
                            endIdx: i + nTarget - 1,
                            similarity: sim,
                            data: window
                        });
                    }
                }
                matches.sort((a, b) => b.similarity - a.similarity);
                const selected = [];
                for (const m of matches) {
                    let overlap = false;
                    for (const s of selected) {
                        if (m.startIdx <= s.endIdx && m.endIdx >= s.startIdx) {
                            overlap = true;
                            break;
                        }
                    }
                    if (!overlap) {
                        selected.push(m);
                    }
                }
                return selected;
            }

            // ---------- Render chart with BB overlay ----------
            function renderChart(data, bb = null, matches = null) {
                if (!data || data.length === 0) {
                    loadStatusEl.textContent = '⚠️ no data';
                    return;
                }

                const hoverTexts = data.map(d => {
                    const dateStr = d.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric',
                        year: 'numeric' });
                    const timeStr = d.date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit',
                        hour12: false });
                    return `${dateStr} ${timeStr}`;
                });
                const indices = data.map((_, i) => i);

                const trace = {
                    type: 'candlestick',
                    x: indices,
                    open: data.map(d => d.open),
                    high: data.map(d => d.high),
                    low: data.map(d => d.low),
                    close: data.map(d => d.close),
                    increasing: { line: { color: '#26a69a' }, fillcolor: '#26a69a' },
                    decreasing: { line: { color: '#ef5350' }, fillcolor: '#ef5350' },
                    name: 'OHLC',
                    text: hoverTexts,
                    hovertemplate: '<b>%{text}</b><br>Open: %{open:.4f}<br>High: %{high:.4f}<br>Low: %{low:.4f}<br>Close: %{close:.4f}<extra></extra>'
                };

                const shapes = [];

                if (bb) {
                    const x0 = bb.x0,
                        x1 = bb.x1,
                        y0 = bb.y0,
                        y1 = bb.y1;
                    shapes.push({
                        type: 'rect',
                        x0: x0,
                        x1: x1,
                        y0: y0,
                        y1: y1,
                        line: { color: '#ffaa66', width: 2, dash: 'dash' },
                        fillcolor: 'rgba(255,170,102,0.10)'
                    });
                }

                if (matches) {
                    for (const m of matches) {
                        const x0 = m.startIdx - 0.4;
                        const x1 = m.endIdx + 0.4;
                        let yMin = Infinity,
                            yMax = -Infinity;
                        for (let i = m.startIdx; i <= m.endIdx; i++) {
                            const d = data[i];
                            if (d.low < yMin) yMin = d.low;
                            if (d.high > yMax) yMax = d.high;
                        }
                        const pad = (yMax - yMin) * 0.05 || 0.01;
                        shapes.push({
                            type: 'rect',
                            x0: x0,
                            x1: x1,
                            y0: yMin - pad,
                            y1: yMax + pad,
                            line: { color: '#66ddaa', width: 2, dash: 'dot' },
                            fillcolor: 'rgba(102,221,170,0.08)'
                        });
                        // Add similarity label as annotation
                        shapes.push({
                            type: 'rect',
                            x0: x0,
                            x1: x0 + 0.5,
                            y0: yMax + pad * 2,
                            y1: yMax + pad * 2 + 0.5,
                            line: { color: 'transparent' },
                            fillcolor: 'transparent'
                        });
                    }
                }

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#b2c9e0', family: 'system-ui, -apple-system, sans-serif' },
                    xaxis: {
                        title: { text: 'Date', font: { color: '#b2c9e0' } },
                        gridcolor: '#1f2b36',
                        zerolinecolor: '#1f2b36',
                        color: '#b2c9e0',
                        rangeslider: { visible: false },
                        tickmode: 'array',
                        tickvals: indices.filter((_, i) => i % Math.max(1, Math.floor(data.length / 20)) === 0),
                        ticktext: indices.filter((_, i) => i % Math.max(1, Math.floor(data.length / 20)) === 0)
                            .map(i => {
                                const d = data[i].date;
                                return `${d.getMonth()+1}/${d.getDate()}`;
                            }),
                        tickangle: -45,
                        showspikes: true,
                        spikemode: 'across',
                        spikethickness: 1,
                        spikecolor: '#4d6a89',
                        tickfont: { size: 10 },
                        range: [-0.5, indices.length - 0.5]
                    },
                    yaxis: {
                        title: { text: 'Price', font: { color: '#b2c9e0' } },
                        gridcolor: '#1f2b36',
                        zerolinecolor: '#1f2b36',
                        color: '#b2c9e0',
                        side: 'right'
                    },
                    margin: { l: 60, r: 20, t: 20, b: 80 },
                    hovermode: 'x unified',
                    showlegend: false,
                    dragmode: (activeTool === 'bb') ? 'select' : 'pan',
                    modebar: { bgcolor: 'rgba(13,19,27,0.8)', color: '#b2c9e0', activecolor: '#6b8bb0' },
                    shapes: shapes,
                    annotations: matches ? matches.map((m, idx) => ({
                        x: (m.startIdx + m.endIdx) / 2,
                        y: (() => {
                            let maxY = -Infinity;
                            for (let i = m.startIdx; i <= m.endIdx; i++) {
                                if (data[i].high > maxY) maxY = data[i].high;
                            }
                            return maxY + (maxY * 0.02);
                        })(),
                        text: `${m.similarity.toFixed(1)}%`,
                        showarrow: false,
                        font: { color: '#66ddaa', size: 10 },
                        bgcolor: 'rgba(13,19,27,0.7)',
                        bordercolor: '#66ddaa',
                        borderwidth: 1,
                        borderpad: 2
                    })) : [],
                    selections: []
                };

                const config = {
                    responsive: true,
                    displayModeBar: true,
                    modeBarButtonsToRemove: ['lasso2d', 'select2d', 'autoScale2d', 'zoomIn2d', 'zoomOut2d',
                        'resetScale2d'
                    ],
                    displaylogo: false
                };

                Plotly.newPlot(container, [trace], layout, config);

                candleCountEl.textContent = data.length;
                if (data.length > 0) {
                    const first = data[0].date;
                    const last = data[data.length - 1].date;
                    dateRangeEl.textContent = `${formatDate(first)} → ${formatDate(last)}`;
                }
                loadStatusEl.textContent = '✅ ready';
                loadStatusEl.style.color = '#8fb0d0';

                // Auto y-range
                let minY = Infinity,
                    maxY = -Infinity;
                for (const d of data) {
                    if (d.low < minY) minY = d.low;
                    if (d.high > maxY) maxY = d.high;
                }
                const padding = (maxY - minY) * 0.05 || 0.1;
                Plotly.relayout(container, { 'yaxis.range': [minY - padding, maxY + padding] });

                // Update BB status
                if (bb) {
                    const candleCount = Math.floor(bb.x1) - Math.ceil(bb.x0) + 1;
                    bbStatus.textContent = `✅ BB: ${candleCount} candles`;
                    bbStatus.className = 'bb-status done';
                    findTrendBtn.disabled = false;
                    findTrendBtn.title = 'Click to find patterns ≥80% similar';
                    zoomHint.textContent = `✅ BB set! Click "Find Trend" to search for similar patterns`;
                    zoomHint.className = 'zoom-hint show success';
                } else {
                    bbStatus.textContent = '⏹ No BB';
                    bbStatus.className = 'bb-status';
                    findTrendBtn.disabled = true;
                    findTrendBtn.title = 'Draw a BB first';
                    if (activeTool === 'bb') {
                        zoomHint.textContent = '✧ Drag a rectangle over candles to define BB';
                        zoomHint.className = 'zoom-hint show';
                    } else {
                        zoomHint.className = 'zoom-hint';
                    }
                }
            }

            function formatDate(date) {
                return date.toISOString().slice(0, 10);
            }

            // ---------- Tool management ----------
            function setActiveTool(tool) {
                [panBtn, bbBtn].forEach(btn => btn.classList.remove('active'));
                if (tool === 'pan') {
                    activeTool = 'pan';
                    panBtn.classList.add('active');
                    Plotly.relayout(container, { dragmode: 'pan' });
                    if (!bbSelection) {
                        zoomHint.textContent = '✧ Pan mode — drag to move';
                        zoomHint.className = 'zoom-hint show';
                    } else {
                        zoomHint.textContent = `✅ BB set! Click "Find Trend" to search`;
                        zoomHint.className = 'zoom-hint show success';
                    }
                } else if (tool === 'bb') {
                    activeTool = 'bb';
                    bbBtn.classList.add('active');
                    Plotly.relayout(container, { dragmode: 'select' });
                    zoomHint.textContent = '✧ Drag a rectangle over candles to define BB';
                    zoomHint.className = 'zoom-hint show';
                    // Clear any previous BB selection when entering BB mode
                    if (bbSelection) {
                        bbSelection = null;
                        matchResults = null;
                        findTrendBtn.disabled = true;
                        bbStatus.textContent = '⏹ No BB';
                        bbStatus.className = 'bb-status';
                        renderChart(ohlcData, null, null);
                    }
                }
            }

            // ---------- BB selection handler ----------
            function handleSelection(eventData) {
                if (activeTool !== 'bb') return;
                if (!eventData || !eventData.range || !eventData.range.x || !eventData.range.y) {
                    return;
                }

                const xRange = eventData.range.x;
                const yRange = eventData.range.y;
                const minX = 0,
                    maxX = ohlcData.length - 1;

                let x0 = Math.max(minX, Math.min(maxX, xRange[0]));
                let x1 = Math.max(minX, Math.min(maxX, xRange[1]));
                if (x0 > x1) [x0, x1] = [x1, x0];

                let minY = Infinity,
                    maxY = -Infinity;
                for (const d of ohlcData) {
                    if (d.low < minY) minY = d.low;
                    if (d.high > maxY) maxY = d.high;
                }
                let y0 = Math.max(minY, Math.min(maxY, yRange[0]));
                let y1 = Math.max(minY, Math.min(maxY, yRange[1]));
                if (y0 > y1) [y0, y1] = [y1, y0];

                // Only accept if range covers at least 2 candles
                if (x1 - x0 < 1 || y1 - y0 < 0.001) {
                    return;
                }

                bbSelection = { x0, x1, y0, y1 };
                matchResults = null;
                findTrendBtn.disabled = false;
                findTrendBtn.title = 'Click to find patterns ≥80% similar';

                // Re-render with BB
                renderChart(ohlcData, bbSelection, null);

                // Clear the selection box
                setTimeout(() => {
                    Plotly.relayout(container, { selections: [] });
                }, 50);
            }

            // ---------- Find Trend ----------
            function findTrend() {
                if (!bbSelection || !ohlcData || ohlcData.length === 0) return;

                const { x0, x1, y0, y1 } = bbSelection;

                // Get candles that overlap with BB (partial touch allowed)
                const targetCandles = [];
                const startIdx = Math.max(0, Math.floor(x0));
                const endIdx = Math.min(ohlcData.length - 1, Math.ceil(x1));

                for (let i = startIdx; i <= endIdx; i++) {
                    const d = ohlcData[i];
                    // Check if candle overlaps BB in price (partial touch)
                    const overlap = (d.low <= y1 && d.high >= y0);
                    if (overlap) {
                        targetCandles.push(d);
                    }
                }

                if (targetCandles.length < 2) {
                    alert('BB must cover at least 2 candles with price overlap.');
                    return;
                }

                // Find matches with threshold 80%
                const matches = findMatchingPatterns(ohlcData, targetCandles, 80);

                if (matches.length === 0) {
                    alert('No patterns found with ≥80% similarity. Try a different BB selection.');
                    renderChart(ohlcData, bbSelection, null);
                    return;
                }

                // Show matches on chart
                matchResults = matches;
                renderChart(ohlcData, bbSelection, matches);

                // Update status
                bbStatus.textContent = `✅ ${matches.length} matches found!`;
                bbStatus.className = 'bb-status done';
                findTrendBtn.disabled = false;
                findTrendBtn.title = `${matches.length} matches found!`;
                zoomHint.textContent = `🎯 Found ${matches.length} patterns with ≥80% similarity!`;
                zoomHint.className = 'zoom-hint show success';

                console.log(`Found ${matches.length} matches:`);
                for (const m of matches) {
                    console.log(`  Match ${m.startIdx}-${m.endIdx}  similarity: ${m.similarity.toFixed(1)}%`);
                }
            }

            // ---------- Zoom / Home ----------
            function getCurrentRange() {
                const layout = container.layout || {};
                const xRange = layout.xaxis && layout.xaxis.range ? layout.xaxis.range : null;
                const yRange = layout.yaxis && layout.yaxis.range ? layout.yaxis.range : null;
                return { xRange, yRange };
            }

            function zoomIn() {
                const { xRange, yRange } = getCurrentRange();
                if (!xRange || !yRange) return;
                const xMid = (xRange[0] + xRange[1]) / 2,
                    yMid = (yRange[0] + yRange[1]) / 2;
                const xSpan = (xRange[1] - xRange[0]) * 0.5,
                    ySpan = (yRange[1] - yRange[0]) * 0.5;
                let newX = [xMid - xSpan * 0.5, xMid + xSpan * 0.5];
                let newY = [yMid - ySpan * 0.5, yMid + ySpan * 0.5];
                const minX = 0,
                    maxX = ohlcData.length - 1;
                newX = [Math.max(minX, newX[0]), Math.min(maxX, newX[1])];
                let minY = Infinity,
                    maxY = -Infinity;
                for (const d of ohlcData) {
                    if (d.low < minY) minY = d.low;
                    if (d.high > maxY) maxY = d.high;
                }
                newY = [Math.max(minY, newY[0]), Math.min(maxY, newY[1])];
                if (newX[1] - newX[0] > 0.5 && newY[1] - newY[0] > 0.001) {
                    Plotly.relayout(container, { 'xaxis.range': newX, 'yaxis.range': newY, selections: [] });
                }
            }

            function zoomOut() {
                const { xRange, yRange } = getCurrentRange();
                if (!xRange || !yRange) return;
                const xMid = (xRange[0] + xRange[1]) / 2,
                    yMid = (yRange[0] + yRange[1]) / 2;
                const xSpan = (xRange[1] - xRange[0]) * 1.8,
                    ySpan = (yRange[1] - yRange[0]) * 1.8;
                let newX = [xMid - xSpan * 0.5, xMid + xSpan * 0.5];
                let newY = [yMid - ySpan * 0.5, yMid + ySpan * 0.5];
                const minX = 0,
                    maxX = ohlcData.length - 1;
                const minY = Math.min(...ohlcData.map(d => d.low));
                const maxY = Math.max(...ohlcData.map(d => d.high));
                const padY = (maxY - minY) * 0.05;
                newX = [Math.max(minX, newX[0]), Math.min(maxX, newX[1])];
                newY = [Math.max(minY - padY, newY[0]), Math.min(maxY + padY, newY[1])];
                if (newX[1] - newX[0] > 0.5 && newY[1] - newY[0] > 0.001) {
                    Plotly.relayout(container, { 'xaxis.range': newX, 'yaxis.range': newY, selections: [] });
                }
            }

            function resetHome() {
                if (!ohlcData || ohlcData.length === 0) return;
                const minX = 0,
                    maxX = ohlcData.length - 1;
                let minY = Infinity,
                    maxY = -Infinity;
                for (const d of ohlcData) {
                    if (d.low < minY) minY = d.low;
                    if (d.high > maxY) maxY = d.high;
                }
                const padding = (maxY - minY) * 0.05 || 0.1;
                Plotly.relayout(container, {
                    'xaxis.range': [minX - 0.5, maxX + 0.5],
                    'yaxis.range': [minY - padding, maxY + padding],
                    selections: []
                });
                // Re-render with current BB and matches
                renderChart(ohlcData, bbSelection, matchResults);
            }

            // ---------- Refresh ----------
            function refreshPage() {
                setActiveTool('pan');
                bbSelection = null;
                matchResults = null;
                findTrendBtn.disabled = true;
                bbStatus.textContent = '⏹ No BB';
                bbStatus.className = 'bb-status';
                loadExcel().then(data => {
                    if (data && data.length > 0) {
                        ohlcData = data;
                        renderChart(ohlcData, null, null);
                        setActiveTool('pan');
                    }
                });
            }

            // ---------- Init ----------
            async function init() {
                const data = await loadExcel();
                if (data && data.length > 0) {
                    ohlcData = data;
                    renderChart(ohlcData, null, null);
                    setActiveTool('pan');
                } else {
                    loadStatusEl.textContent = '⚠️ no data loaded';
                    loadStatusEl.style.color = '#e6b88a';
                }

                // --- event listeners ---
                panBtn.addEventListener('click', () => setActiveTool('pan'));
                bbBtn.addEventListener('click', () => {
                    if (activeTool === 'bb') {
                        setActiveTool('pan');
                    } else {
                        setActiveTool('bb');
                    }
                });
                findTrendBtn.addEventListener('click', findTrend);

                homeBtn.addEventListener('click', resetHome);
                zoomInBtn.addEventListener('click', zoomIn);
                zoomOutBtn.addEventListener('click', zoomOut);
                refreshBtn.addEventListener('click', refreshPage);

                container.addEventListener('dblclick', resetHome);

                // Selection handler for BB - using both plotly_selected and plotly_selecting
                container.on('plotly_selected', handleSelection);

                // Also handle plotly_selecting for real-time feedback
                container.on('plotly_selecting', function(eventData) {
                    if (activeTool === 'bb' && eventData && eventData.range) {
                        // Just show that selection is happening
                    }
                });

                // resize
                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        if (container && container.clientWidth > 0) {
                            Plotly.Plots.resize(container);
                        }
                    }, 200);
                });
            }

            init();
        })();
    </script>
</body>
</html>
