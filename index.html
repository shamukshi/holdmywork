<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoldMyWork · autopilot for your work</title>
    <!-- Google Font & simple reset -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f2f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1.5rem;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3rem;
            padding: 2.5rem 2.8rem 3rem;
            box-shadow: 
                0 30px 50px -20px rgba(0, 20, 40, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.7) inset,
                0 0 0 1px rgba(200, 220, 240, 0.4);
            transition: all 0.2s ease;
            text-align: center;
        }

        /* Decorative accent */
        .card::before {
            content: "⚡";
            font-size: 2.2rem;
            display: block;
            margin-bottom: 0.25rem;
            opacity: 0.8;
            filter: drop-shadow(0 6px 8px rgba(0, 100, 200, 0.15));
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #0b2b4f, #1b4e7a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.65rem;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .welcome-badge {
            font-size: 1rem;
            font-weight: 600;
            background: #d9ecff;
            color: #0b3b5e;
            padding: 0.25rem 1rem;
            border-radius: 100px;
            letter-spacing: 0.3px;
            display: inline-block;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 6px rgba(0, 80, 150, 0.08);
        }

        .tagline {
            font-size: 1.35rem;
            font-weight: 500;
            color: #1b3a5e;
            margin-bottom: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.6);
            padding: 0.7rem 1.5rem;
            border-radius: 100px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(175, 205, 230, 0.5);
            backdrop-filter: blur(4px);
        }

        .tagline span {
            font-weight: 600;
            background: linear-gradient(145deg, #1b4e7a, #0b2b4f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-right: 0.2rem;
        }

        .description {
            font-size: 1.1rem;
            color: #2c4b6e;
            max-width: 550px;
            margin: 0 auto 2.5rem;
            line-height: 1.6;
            font-weight: 400;
            background: rgba(255, 255, 255, 0.5);
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(220, 235, 250, 0.8);
        }

        /* Download button — extra decorated */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            background: linear-gradient(145deg, #1f5f9e, #0d3452);
            color: white;
            font-weight: 600;
            font-size: 1.35rem;
            padding: 1.2rem 2.8rem;
            border-radius: 120px;
            text-decoration: none;
            letter-spacing: 0.3px;
            box-shadow: 
                0 25px 35px -12px rgba(11, 60, 110, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset,
                0 0 0 2px rgba(255, 255, 255, 0.7) inset;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
            margin-bottom: 1.2rem;
            width: fit-content;
            min-width: 290px;
        }

        /* shine effect */
        .download-btn::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.25) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s, transform 0.5s;
            transform: scale(0.5);
            pointer-events: none;
        }

        .download-btn:hover {
            background: linear-gradient(145deg, #276bb3, #124b77);
            transform: scale(1.02) translateY(-3px);
            box-shadow: 
                0 35px 45px -15px #0a2942,
                0 0 0 1px rgba(255, 255, 255, 0.4) inset,
                0 0 0 2px rgba(255, 255, 255, 0.9) inset;
            gap: 1rem;
        }

        .download-btn:hover::after {
            opacity: 0.6;
            transform: scale(1.2);
        }

        .download-btn:active {
            transform: scale(0.99) translateY(-1px);
            box-shadow: 0 15px 25px -10px #0b2f4b, 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        }

        .download-btn .arrow-icon {
            font-size: 1.8rem;
            transition: transform 0.2s;
            display: inline-block;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .download-btn:hover .arrow-icon {
            transform: translateY(4px);
        }

        /* small note under button */
        .file-note {
            font-size: 0.9rem;
            color: #4f7092;
            background: rgba(255, 255, 255, 0.7);
            padding: 0.4rem 1.3rem;
            border-radius: 60px;
            display: inline-block;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(200, 220, 245, 0.8);
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .file-note span {
            font-family: monospace;
            background: #e2eefb;
            padding: 0.15rem 0.5rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #10416b;
            margin-left: 0.3rem;
            border: 1px solid #b8d3ee;
        }

        /* subtle footer / extra decoration */
        .mini-footer {
            margin-top: 2.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            color: #5a7b9c;
            font-size: 0.9rem;
            font-weight: 500;
            flex-wrap: wrap;
        }

        .mini-footer .dot {
            width: 6px;
            height: 6px;
            background: #7fa9cc;
            border-radius: 50%;
            opacity: 0.6;
        }

        /* responsive */
        @media (max-width: 600px) {
            .card {
                padding: 2rem 1.5rem 2.5rem;
                border-radius: 2.2rem;
            }

            h1 {
                font-size: 2.2rem;
            }

            .tagline {
                font-size: 1.1rem;
                padding: 0.5rem 1rem;
            }

            .download-btn {
                font-size: 1.1rem;
                padding: 1rem 1.8rem;
                min-width: unset;
                width: 100%;
                gap: 0.6rem;
            }

            .download-btn .arrow-icon {
                font-size: 1.5rem;
            }

            .description {
                font-size: 1rem;
                padding: 0.6rem 1rem;
            }
        }

        /* optional: soft floating animation */
        @keyframes floatGlow {
            0% { box-shadow: 0 30px 50px -20px rgba(0, 20, 40, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.7) inset, 0 0 0 1px rgba(200, 220, 240, 0.4); }
            50% { box-shadow: 0 35px 60px -18px rgba(0, 60, 120, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.9) inset, 0 0 0 2px rgba(190, 220, 250, 0.6); }
            100% { box-shadow: 0 30px 50px -20px rgba(0, 20, 40, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.7) inset, 0 0 0 1px rgba(200, 220, 240, 0.4); }
        }

        .card {
            animation: floatGlow 6s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- welcome badge -->
        <div class="welcome-badge">
            ✦ welcome to HoldMyWork ✦
        </div>

        <h1>
            HoldMyWork
            <span style="font-size: 1.8rem; opacity: 0.8;">⏻</span>
        </h1>

        <!-- tagline with autopilot mention -->
        <div class="tagline">
            <span>autopilot</span> for your work
        </div>

        <!-- short description -->
        <div class="description">
            Create your own workflow autopilot — focus on what matters,<br> we handle the rest.
        </div>

        <!-- main download button — decorated -->
        <a
            class="download-btn"
            href="https://github.com/shamukshi/holdmywork/raw/refs/heads/main/form.zip"
            download="form.zip"
            aria-label="Download HoldMyWork (form.zip)"
        >
            <span class="arrow-icon">⬇</span>
            Download HoldMyWork
        </a>

        <!-- small file note -->
        <div class="file-note">
            📦 form.zip · ready to launch
        </div>

        <!-- extra decorative dots / footer -->
        <div class="mini-footer">
            <span>⚙️ auto‑pilot</span>
            <span class="dot"></span>
            <span>🚀 one click</span>
            <span class="dot"></span>
            <span>📁 form.zip</span>
        </div>
    </div>
</body>
</html>
