<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HoldMyWork · OHLC + Tools</title>
    <!-- Plotly CDN -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f14;
            color: #d1d9e6;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px 20px 20px 20px;
            overflow: hidden;
        }

        .app-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 16px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .brand h1 {
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            color: #eef3fa;
            background: linear-gradient(145deg, #eef3fa 0%, #b0c8e0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand small {
            font-size: 0.9rem;
            font-weight: 300;
            color: #8b9bb5;
            margin-left: 4px;
            letter-spacing: 0.2px;
            -webkit-text-fill-color: #8b9bb5;
        }

        .sub-message {
            font-size: 0.95rem;
            color: #a2b7d0;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #2a3440;
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }

        .chart-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .info-badge {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 18px;
            font-size: 0.75rem;
            color: #8499b3;
            background: #121b24;
            padding: 4px 16px 4px 14px;
            border-radius: 40px;
            border: 1px solid #25323f;
        }

        .info-badge span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .info-badge .num {
            color: #d6e5f8;
            font-weight: 500;
        }

        .tools-group {
            display: flex;
            gap: 4px;
            align-items: center;
            background: #121b24;
            padding: 3px 6px;
            border-radius: 40px;
            border: 1px solid #25323f;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: #8ba0b8;
            padding: 4px 8px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .tool-btn:hover {
            background: #1e2a36;
            color: #c0d4e8;
        }
        .tool-btn.active {
            background: #2d4b5e;
            color: #e8f4ff;
            box-shadow: 0 0 10px rgba(70, 150, 220, 0.2);
        }
        .tool-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .tool-divider {
            width: 1px;
            height: 22px;
            background: #2a3a4a;
            margin: 0 2px;
        }

        .chart-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            background: #0d131b;
            border-radius: 20px;
            border: 1px solid #202b36;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            padding: 8px;
            position: relative;
            transition: all 0.1s;
        }

        #chart-container {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            background: #0d131b;
        }

        .zoom-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2633ee;
            backdrop-filter: blur(6px);
            padding: 6px 18px;
            border-radius: 60px;
            border: 1px solid #3a5a7a;
            font-size: 0.8rem;
            color: #b8d0e8;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .zoom-hint.show {
            opacity: 1;
        }

        /* Refresh button specific style */
        .refresh-btn {
            background: #1e2a36;
            border: 1px solid #3a5068;
            color: #d1d9e6;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .refresh-btn:hover {
            background: #2a3a4a;
            border-color: #5a7a9a;
            color: white;
        }
        .refresh-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px 12px 12px 12px;
            }
            .brand h1 {
                font-size: 1.4rem;
            }
            .sub-message {
                font-size: 0.75rem;
                padding: 2px 10px;
            }
            .info-badge {
                font-size: 0.65rem;
                padding: 2px 10px;
            }
            .tool-btn {
                font-size: 0.65rem;
                padding: 3px 6px;
            }
            .tool-btn svg {
                width: 14px;
                height: 14px;
            }
            .refresh-btn {
                font-size: 0.65rem;
                padding: 3px 8px;
            }
            .refresh-btn svg {
                width: 14px;
                height: 14px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1e2833;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a5068;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <h1>holdmywork</h1>
            <small>⚡</small>
        </div>
        <div class="sub-message">
            kkk care of my work while I go do something else.
        </div>
    </header>

    <div class="chart-controls">
        <div class="info-badge" id="infoBadge">
            <span>📄 <span class="num" id="candleCount">—</span> candles</span>
            <span>📅 <span id="dateRange">—</span></span>
            <span id="loadStatus" style="color:#8fb0d0;">⏳ loading…</span>
        </div>

        <div class="tools-group" id="toolsGroup">
            <!-- Pan -->
            <button class="tool-btn" id="panBtn" title="Pan mode (click to toggle)">
                <svg viewBox="0 0 24 24">
                    <path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l3 3 3-3M19 9l3 3-3 3M9 19l3 3 3-3M5 15l-3 3 3 3" />
                    <circle cx="12" cy="12" r="2" />
                </svg>
                <span>Pan</span>
            </button>
            <div class="tool-divider"></div>

            <!-- Magnifying Glass (zoom box) -->
            <button class="tool-btn" id="zoomBoxBtn" title="Draw a box to zoom in">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7" />
                    <line x1="16" y1="16" x2="22" y2="22" />
                    <rect x="2" y="2" width="18" height="18" rx="2" stroke-dasharray="4 2" opacity="0.5" />
                </svg>
                <span>Zoom Box</span>
            </button>
            <div class="tool-divider"></div>

            <!-- Reset to Home -->
            <button class="tool-btn" id="homeBtn" title="Reset to full view">
                <svg viewBox="0 0 24 24">
                    <path d="M3 12l9-9 9 9" />
                    <path d="M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10" />
                    <rect x="10" y="14" width="4" height="4" rx="1" />
                </svg>
                <span>Home</span>
            </button>
            <div class="tool-divider"></div>

            <!-- Zoom In -->
            <button class="tool-btn" id="zoomInBtn" title="Zoom in">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7" />
                    <line x1="16" y1="16" x2="22" y2="22" />
                    <line x1="11" y1="8" x2="11" y2="14" />
                    <line x1="8" y1="11" x2="14" y2="11" />
                </svg>
                <span>Zoom In</span>
            </button>
            <div class="tool-divider"></div>

            <!-- Zoom Out -->
            <button class="tool-btn" id="zoomOutBtn" title="Zoom out">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7" />
                    <line x1="16" y1="16" x2="22" y2="22" />
                    <line x1="8" y1="11" x2="14" y2="11" />
                </svg>
                <span>Zoom Out</span>
            </button>
            <div class="tool-divider"></div>

            <!-- Refresh -->
            <button class="refresh-btn" id="refreshBtn" title="Refresh everything">
                <svg viewBox="0 0 24 24">
                    <path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9" />
                </svg>
                <span>Refresh</span>
            </button>
        </div>
    </div>

    <div class="chart-wrapper" id="chartWrapper">
        <div id="chart-container"></div>
        <div class="zoom-hint" id="zoomHint">✧ Drag a rectangle to zoom in</div>
    </div>

    <script>
        (function() {
            "use strict";

            const container = document.getElementById('chart-container');
            const candleCountEl = document.getElementById('candleCount');
            const dateRangeEl = document.getElementById('dateRange');
            const loadStatusEl = document.getElementById('loadStatus');

            // tool buttons
            const panBtn = document.getElementById('panBtn');
            const zoomBoxBtn = document.getElementById('zoomBoxBtn');
            const homeBtn = document.getElementById('homeBtn');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const zoomHint = document.getElementById('zoomHint');

            let ohlcData = [];
            let activeTool = null; // 'pan' | 'zoomBox' | null

            // ---------- column detection ----------
            function findColumns(headers) {
                const lowerMap = {};
                headers.forEach(h => { lowerMap[h.trim().toLowerCase()] = h; });

                const dateCol = lowerMap['date'] || lowerMap['timestamp'] || lowerMap['time'] || lowerMap['datetime'] ||
                    null;
                const openCol = lowerMap['open_norm'] || lowerMap['open'] || lowerMap['open price'] || null;
                const highCol = lowerMap['high_norm'] || lowerMap['high'] || lowerMap['high price'] || null;
                const lowCol = lowerMap['low_norm'] || lowerMap['low'] || lowerMap['low price'] || null;
                const closeCol = lowerMap['close_norm'] || lowerMap['close'] || lowerMap['close price'] || lowerMap[
                    'last'] || null;

                return { dateCol, openCol, highCol, lowCol, closeCol };
            }

            function parseExcelDate(val) {
                if (typeof val === 'number') {
                    const epoch = new Date(1899, 11, 30);
                    return new Date(epoch.getTime() + val * 86400000);
                }
                if (typeof val === 'string') {
                    const d = new Date(val);
                    if (!isNaN(d.getTime())) return d;
                    const trimmed = val.trim();
                    const ms = Date.parse(trimmed);
                    if (!isNaN(ms)) return new Date(ms);
                }
                return null;
            }

            // ---------- load Excel ----------
            async function loadExcel() {
                try {
                    loadStatusEl.textContent = '⏳ reading…';

                    const response = await fetch('data/ohlc.xlsx');

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: Could not load data/ohlc.xlsx`);
                    }

                    const arrayBuffer = await response.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: false });

                    let sheetName = 'tab_1';
                    if (!workbook.SheetNames.includes(sheetName)) {
                        sheetName = workbook.SheetNames[0];
                    }

                    const firstSheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: null });

                    if (!rows || rows.length === 0) {
                        throw new Error('No data rows found in sheet: ' + sheetName);
                    }

                    const headers = Object.keys(rows[0]);
                    const { dateCol, openCol, highCol, lowCol, closeCol } = findColumns(headers);

                    if (!dateCol || !openCol || !highCol || !lowCol || !closeCol) {
                        throw new Error(
                            `Could not detect OHLC columns. Found: ${headers.join(', ')}`
                        );
                    }

                    const parsed = [];
                    for (const row of rows) {
                        const rawDate = row[dateCol];
                        const open = parseFloat(row[openCol]);
                        const high = parseFloat(row[highCol]);
                        const low = parseFloat(row[lowCol]);
                        const close = parseFloat(row[closeCol]);

                        if (rawDate === undefined || rawDate === null || rawDate === '') continue;
                        if ([open, high, low, close].some(v => isNaN(v) || !isFinite(v))) continue;

                        const dateObj = parseExcelDate(rawDate);
                        if (!dateObj || isNaN(dateObj.getTime())) continue;

                        const timeSec = Math.floor(dateObj.getTime() / 1000);
                        if (timeSec === null) continue;

                        const exists = parsed.some(d => d.time === timeSec);
                        if (exists) continue;

                        parsed.push({
                            time: timeSec,
                            open: open,
                            high: high,
                            low: low,
                            close: close,
                            date: dateObj
                        });
                    }

                    if (parsed.length === 0) {
                        throw new Error('No valid OHLC rows after parsing.');
                    }

                    parsed.sort((a, b) => a.time - b.time);
                    ohlcData = parsed;
                    return parsed;
                } catch (err) {
                    console.error('Excel load error:', err);
                    loadStatusEl.textContent = `⚠️ ${err.message}`;
                    loadStatusEl.style.color = '#e6b88a';
                    return null;
                }
            }

            // ---------- render chart with Plotly ----------
            function renderChart(data) {
                if (!data || data.length === 0) {
                    loadStatusEl.textContent = '⚠️ no data';
                    return;
                }

                console.log('Rendering', data.length, 'hourly candles');

                const hoverTexts = data.map(d => {
                    const dateStr = d.date.toLocaleDateString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    });
                    const timeStr = d.date.toLocaleTimeString('en-US', {
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: false
                    });
                    return `${dateStr} ${timeStr}`;
                });

                const dateTickVals = [];
                const dateTickTexts = [];
                let currentDateKey = '';
                for (let i = 0; i < data.length; i++) {
                    const d = data[i].date;
                    const dateKey = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                    if (dateKey !== currentDateKey) {
                        currentDateKey = dateKey;
                        dateTickVals.push(i);
                        const month = d.toLocaleString('en-US', { month: 'short' });
                        const day = d.getDate();
                        const yearShort = String(d.getFullYear()).slice(-2);
                        dateTickTexts.push(`${month} ${day}/${yearShort}`);
                    }
                }

                const indices = data.map((_, i) => i);

                const trace = {
                    type: 'candlestick',
                    x: indices,
                    open: data.map(d => d.open),
                    high: data.map(d => d.high),
                    low: data.map(d => d.low),
                    close: data.map(d => d.close),
                    increasing: { line: { color: '#26a69a' }, fillcolor: '#26a69a' },
                    decreasing: { line: { color: '#ef5350' }, fillcolor: '#ef5350' },
                    name: 'OHLC',
                    text: hoverTexts,
                    hovertemplate: '<b>%{text}</b><br>' +
                        'Open: %{open:.4f}<br>' +
                        'High: %{high:.4f}<br>' +
                        'Low: %{low:.4f}<br>' +
                        'Close: %{close:.4f}<extra></extra>'
                };

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#b2c9e0', family: 'system-ui, -apple-system, sans-serif' },
                    xaxis: {
                        title: { text: 'Date', font: { color: '#b2c9e0' } },
                        gridcolor: '#1f2b36',
                        zerolinecolor: '#1f2b36',
                        color: '#b2c9e0',
                        rangeslider: { visible: false },
                        tickmode: 'array',
                        tickvals: dateTickVals,
                        ticktext: dateTickTexts,
                        tickangle: -45,
                        showspikes: true,
                        spikemode: 'across',
                        spikethickness: 1,
                        spikecolor: '#4d6a89',
                        tickfont: { size: 10 },
                        range: [-0.5, indices.length - 0.5]
                    },
                    yaxis: {
                        title: { text: 'Price', font: { color: '#b2c9e0' } },
                        gridcolor: '#1f2b36',
                        zerolinecolor: '#1f2b36',
                        color: '#b2c9e0',
                        side: 'right'
                    },
                    margin: { l: 60, r: 20, t: 20, b: 80 },
                    hovermode: 'x unified',
                    showlegend: false,
                    dragmode: 'pan', // default: pan
                    modebar: {
                        bgcolor: 'rgba(13, 19, 27, 0.8)',
                        color: '#b2c9e0',
                        activecolor: '#6b8bb0'
                    },
                    selections: []
                };

                const config = {
                    responsive: true,
                    displayModeBar: true,
                    modeBarButtonsToRemove: ['lasso2d', 'select2d', 'autoScale2d', 'zoomIn2d', 'zoomOut2d',
                        'resetScale2d'
                    ],
                    displaylogo: false
                };

                Plotly.newPlot(container, [trace], layout, config);
                // store reference
                container._layout = layout;

                candleCountEl.textContent = data.length;
                if (data.length > 0) {
                    const first = data[0].date;
                    const last = data[data.length - 1].date;
                    dateRangeEl.textContent = `${formatDate(first)} → ${formatDate(last)}`;
                }

                loadStatusEl.textContent = '✅ ready';
                loadStatusEl.style.color = '#8fb0d0';

                // set initial y-range with padding
                let minY = Infinity,
                    maxY = -Infinity;
                for (const d of data) {
                    if (d.low < minY) minY = d.low;
                    if (d.high > maxY) maxY = d.high;
                }
                const padding = (maxY - minY) * 0.05;
                Plotly.relayout(container, {
                    'yaxis.range': [minY - padding, maxY + padding]
                });

                // set default active tool: pan is active by default
                setActiveTool('pan');
            }

            function formatDate(date) {
                return date.toISOString().slice(0, 10);
            }

            // ---------- Tool management ----------
            function setActiveTool(tool) {
                // clear all active states
                [panBtn, zoomBoxBtn].forEach(btn => btn.classList.remove('active'));
                zoomHint.classList.remove('show');

                // remove any previous zoom handler
                if (container._zoomHandler) {
                    container.removeListener('plotly_selected', container._zoomHandler);
                    container._zoomHandler = null;
                }

                if (tool === 'pan') {
                    activeTool = 'pan';
                    panBtn.classList.add('active');
                    Plotly.relayout(container, { dragmode: 'pan' });
                } else if (tool === 'zoomBox') {
                    activeTool = 'zoomBox';
                    zoomBoxBtn.classList.add('active');
                    zoomHint.classList.add('show');
                    Plotly.relayout(container, { dragmode: 'select' });

                    // setup zoom handler
                    const handler = function(eventData) {
                        if (!eventData || !eventData.range || !eventData.range.x || !eventData.range.y) {
                            return;
                        }
                        const xRange = eventData.range.x;
                        const yRange = eventData.range.y;

                        const minX = 0;
                        const maxX = ohlcData.length - 1;
                        const x0 = Math.max(minX, Math.min(maxX, xRange[0]));
                        const x1 = Math.max(minX, Math.min(maxX, xRange[1]));

                        let minY = Infinity,
                            maxY = -Infinity;
                        for (const d of ohlcData) {
                            if (d.low < minY) minY = d.low;
                            if (d.high > maxY) maxY = d.high;
                        }
                        const y0 = Math.max(minY, Math.min(maxY, yRange[0]));
                        const y1 = Math.max(minY, Math.min(maxY, yRange[1]));

                        if (Math.abs(x1 - x0) < 0.5 || Math.abs(y1 - y0) < 0.01) {
                            return;
                        }

                        // Apply zoom
                        Plotly.relayout(container, {
                            'xaxis.range': [x0, x1],
                            'yaxis.range': [y0, y1],
                            dragmode: 'select'
                        });

                        // Clear the selection box
                        setTimeout(() => {
                            const currentLayout = container.layout || {};
                            if (currentLayout.selections) {
                                Plotly.relayout(container, {
                                    selections: []
                                });
                            }
                            Plotly.relayout(container, {
                                'xaxis.range': [x0, x1],
                                'yaxis.range': [y0, y1],
                                selections: []
                            });
                        }, 50);
                    };
                    container._zoomHandler = handler;
                    container.on('plotly_selected', handler);
                } else {
                    activeTool = null;
                    // fallback to pan
                    Plotly.relayout(container, { dragmode: 'pan' });
                    panBtn.classList.add('active');
                    activeTool = 'pan';
                }
            }

            // ---------- Zoom functions ----------
            function getCurrentRange() {
                const layout = container.layout || {};
                const xRange = layout.xaxis && layout.xaxis.range ? layout.xaxis.range : null;
                const yRange = layout.yaxis && layout.yaxis.range ? layout.yaxis.range : null;
                return { xRange, yRange };
            }

            function zoomIn() {
                const { xRange, yRange } = getCurrentRange();
                if (!xRange || !yRange) return;
                const xMid = (xRange[0] + xRange[1]) / 2;
                const yMid = (yRange[0] + yRange[1]) / 2;
                const xSpan = (xRange[1] - xRange[0]) * 0.5;
                const ySpan = (yRange[1] - yRange[0]) * 0.5;
                const newX = [xMid - xSpan * 0.5, xMid + xSpan * 0.5];
                const newY = [yMid - ySpan * 0.5, yMid + ySpan * 0.5];
                // clamp
                const minX = 0,
                    maxX = ohlcData.length - 1;
                const clampedX = [Math.max(minX, newX[0]), Math.min(maxX, newX[1])];
                let minY = Infinity,
                    maxY = -Infinity;
                for (const d of ohlcData) {
                    if (d.low < minY) minY = d.low;
                    if (d.high > maxY) maxY = d.high;
                }
                const clampedY = [Math.max(minY, newY[0]), Math.min(maxY, newY[1])];
                if (clampedX[1] - clampedX[0] > 0.5 && clampedY[1] - clampedY[0] > 0.001) {
                    Plotly.relayout(container, {
                        'xaxis.range': clampedX,
                        'yaxis.range': clampedY,
                        selections: []
                    });
                }
            }

            function zoomOut() {
                const { xRange, yRange } = getCurrentRange();
                if (!xRange || !yRange) return;
                const xMid = (xRange[0] + xRange[1]) / 2;
                const yMid = (yRange[0] + yRange[1]) / 2;
                const xSpan = (xRange[1] - xRange[0]) * 1.8;
                const ySpan = (yRange[1] - yRange[0]) * 1.8;
                let newX = [xMid - xSpan * 0.5, xMid + xSpan * 0.5];
                let newY = [yMid - ySpan * 0.5, yMid + ySpan * 0.5];
                const minX = 0,
                    maxX = ohlcData.length - 1;
                const minY = Math.min(...ohlcData.map(d => d.low));
                const maxY = Math.max(...ohlcData.map(d => d.high));
                const padY = (maxY - minY) * 0.05;
                newX = [Math.max(minX, newX[0]), Math.min(maxX, newX[1])];
                newY = [Math.max(minY - padY, newY[0]), Math.min(maxY + padY, newY[1])];
                if (newX[1] - newX[0] > 0.5 && newY[1] - newY[0] > 0.001) {
                    Plotly.relayout(container, {
                        'xaxis.range': newX,
                        'yaxis.range': newY,
                        selections: []
                    });
                }
            }

            function resetHome() {
                if (!ohlcData || ohlcData.length === 0) return;
                const minX = 0;
                const maxX = ohlcData.length - 1;
                let minY = Infinity,
                    maxY = -Infinity;
                for (const d of ohlcData) {
                    if (d.low < minY) minY = d.low;
                    if (d.high > maxY) maxY = d.high;
                }
                const padding = (maxY - minY) * 0.05;
                Plotly.relayout(container, {
                    'xaxis.range': [minX - 0.5, maxX + 0.5],
                    'yaxis.range': [minY - padding, maxY + padding],
                    selections: []
                });
            }

            // ---------- Refresh function ----------
            function refreshPage() {
                // Reset tool states
                setActiveTool('pan');
                
                // Reset zoom to home
                resetHome();
                
                // Reload data and re-render chart
                loadExcel().then(data => {
                    if (data && data.length > 0) {
                        renderChart(data);
                    } else {
                        loadStatusEl.textContent = '⚠️ no data loaded';
                        loadStatusEl.style.color = '#e6b88a';
                    }
                });
            }

            // ---------- init ----------
            async function init() {
                const data = await loadExcel();
                if (data && data.length > 0) {
                    renderChart(data);
                } else {
                    loadStatusEl.textContent = '⚠️ no data loaded';
                    loadStatusEl.style.color = '#e6b88a';
                }

                // ----- Tool buttons -----
                panBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (activeTool === 'pan') {
                        setActiveTool(null);
                        panBtn.classList.remove('active');
                        activeTool = null;
                        Plotly.relayout(container, { dragmode: 'pan' });
                    } else {
                        setActiveTool('pan');
                    }
                });

                zoomBoxBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (activeTool === 'zoomBox') {
                        setActiveTool('pan');
                    } else {
                        setActiveTool('zoomBox');
                    }
                });

                homeBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    resetHome();
                });

                zoomInBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    zoomIn();
                });

                zoomOutBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    zoomOut();
                });

                // Refresh button
                refreshBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    refreshPage();
                });

                // double-click reset
                container.addEventListener('dblclick', function(e) {
                    resetHome();
                });
            }

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (container && container.clientWidth > 0) {
                        Plotly.Plots.resize(container);
                    }
                }, 200);
            });

            init();
        })();
    </script>
</body>
</html>
