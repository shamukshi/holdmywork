<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        .main-image {
            width: 300px;
            max-width: 90%;
            height: auto;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            color: #aab2bd;
            margin-bottom: 30px;
        }

        /* Download button */
        .download-button {
            display: inline-block;
            padding: 15px 32px;
            background: #238636;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.2s;
        }

        .download-button:hover {
            background: #2ea043;
            transform: translateY(-2px);
        }

        .download-info {
            margin-top: 12px;
            font-size: 14px;
            color: #8b949e;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="images/lucy.jpg" alt="Lucy" class="main-image">

        <h1>Coming Soon</h1>

        <p>
            Our website is currently under development.<br>
            We'll be launching soon.
        </p>

        <!-- REPLACE THE URL BELOW WITH YOUR APP.EXE RELEASE URL -->

        <a href="PASTE-YOUR-APP-EXE-DOWNLOAD-LINK-HERE"
           class="download-button">
            Download App
        </a>

        <div class="download-info">
            Windows • app.exe
        </div>

    </div>

</body>
