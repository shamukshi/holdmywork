<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HoldMyWork · OHLC</title>
    <!-- Plotly CDN -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js">
    </script>
    <!-- Papaparse for robust CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f14;
            color: #d1d9e6;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px 20px 20px 20px;
            overflow: hidden;
        }

        .app-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 16px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .brand h1 {
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            color: #eef3fa;
            background: linear-gradient(145deg, #eef3fa 0%, #b0c8e0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand small {
            font-size: 0.9rem;
            font-weight: 300;
            color: #8b9bb5;
            margin-left: 4px;
            letter-spacing: 0.2px;
            -webkit-text-fill-color: #8b9bb5;
        }

        .sub-message {
            font-size: 0.95rem;
            color: #a2b7d0;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #2a3440;
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }

        .chart-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .time-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .time-buttons button {
            background: transparent;
            border: 1px solid #2d3a48;
            color: #b6c9e0;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.3px;
            background: #141c26;
        }

        .time-buttons button:hover {
            background: #25313f;
            border-color: #5b748f;
            color: #f0f7ff;
        }

        .time-buttons button.active {
            background: #2b3d52;
            border-color: #6b8bb0;
            color: #ffffff;
            box-shadow: 0 0 6px rgba(70, 130, 200, 0.2);
        }

        .info-badge {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 18px;
            margin-left: auto;
            font-size: 0.75rem;
            color: #8499b3;
            background: #121b24;
            padding: 4px 16px 4px 14px;
            border-radius: 40px;
            border: 1px solid #25323f;
        }

        .info-badge span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .info-badge .num {
            color: #d6e5f8;
            font-weight: 500;
        }

        .chart-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            background: #0d131b;
            border-radius: 20px;
            border: 1px solid #202b36;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            padding: 8px;
            position: relative;
            transition: all 0.1s;
        }

        #chart-container {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            background: #0d131b;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px 12px 12px 12px;
            }
            .brand h1 {
                font-size: 1.4rem;
            }
            .sub-message {
                font-size: 0.75rem;
                padding: 2px 10px;
            }
            .info-badge {
                font-size: 0.65rem;
                padding: 2px 10px;
            }
            .time-buttons button {
                font-size: 0.6rem;
                padding: 2px 10px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1e2833;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a5068;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <h1>holdmywork</h1>
            <small>⚡</small>
        </div>
        <div class="sub-message">
            Take care of my work while I go do something else.
        </div>
    </header>

    <div class="chart-controls">
        <div class="time-buttons" id="timeButtons">
            <button data-range="1m" class="active">1m</button>
            <button data-range="5m">5m</button>
            <button data-range="15m">15m</button>
            <button data-range="1h">1h</button>
            <button data-range="1d">1d</button>
        </div>
        <div class="info-badge" id="infoBadge">
            <span>📄 <span class="num" id="candleCount">—</span> candles</span>
            <span>📅 <span id="dateRange">—</span></span>
            <span id="loadStatus" style="color:#8fb0d0;">⏳ loading…</span>
        </div>
    </div>

    <div class="chart-wrapper">
        <div id="chart-container"></div>
    </div>

    <script>
        (function() {
            "use strict";

            const container = document.getElementById('chart-container');
            const candleCountEl = document.getElementById('candleCount');
            const dateRangeEl = document.getElementById('dateRange');
            const loadStatusEl = document.getElementById('loadStatus');
            const timeButtons = document.querySelectorAll('#timeButtons button');

            // mapping range key -> CSV file path
            const fileMap = {
                '1m': 'data/1_min.csv',
                '5m': 'data/5_min.csv',
                '15m': 'data/15_min.csv',
                '1h': 'data/1_hr.csv',
                '1d': 'data/1_day.csv'
            };

            // cache for loaded CSV data: { filePath: [ {time, open, high, low, close, date} ] }
            const dataCache = new Map();
            let currentRange = '1m';

            // ---------- column detection (case-insensitive) ----------
            function findColumns(headers) {
                const lowerMap = {};
                headers.forEach(h => {
                    if (h !== undefined && h !== null) {
                        lowerMap[h.trim().toLowerCase()] = h;
                    }
                });

                const dateCol = lowerMap['date'] || lowerMap['timestamp'] || lowerMap['time'] || lowerMap['datetime'] ||
                    null;
                const openCol = lowerMap['open_norm'] || lowerMap['open'] || lowerMap['open price'] || null;
                const highCol = lowerMap['high_norm'] || lowerMap['high'] || lowerMap['high price'] || null;
                const lowCol = lowerMap['low_norm'] || lowerMap['low'] || lowerMap['low price'] || null;
                const closeCol = lowerMap['close_norm'] || lowerMap['close'] || lowerMap['close price'] || lowerMap[
                    'last'] || null;

                return { dateCol, openCol, highCol, lowCol, closeCol };
            }

            function parseExcelDate(val) {
                if (typeof val === 'number') {
                    const epoch = new Date(1899, 11, 30);
                    return new Date(epoch.getTime() + val * 86400000);
                }
                if (typeof val === 'string') {
                    const d = new Date(val);
                    if (!isNaN(d.getTime())) return d;
                    const trimmed = val.trim();
                    const ms = Date.parse(trimmed);
                    if (!isNaN(ms)) return new Date(ms);
                }
                return null;
            }

            // ---------- parse rows (array of objects) ----------
            function parseRows(rows) {
                if (!rows || rows.length === 0) return [];

                const headers = Object.keys(rows[0]);
                const { dateCol, openCol, highCol, lowCol, closeCol } = findColumns(headers);

                if (!dateCol || !openCol || !highCol || !lowCol || !closeCol) {
                    console.warn('Could not detect OHLC columns. Found:', headers);
                    return [];
                }

                const parsed = [];
                for (const row of rows) {
                    const rawDate = row[dateCol];
                    const open = parseFloat(row[openCol]);
                    const high = parseFloat(row[highCol]);
                    const low = parseFloat(row[lowCol]);
                    const close = parseFloat(row[closeCol]);

                    if (rawDate === undefined || rawDate === null || rawDate === '') continue;
                    if ([open, high, low, close].some(v => isNaN(v) || !isFinite(v))) continue;

                    const dateObj = parseExcelDate(rawDate);
                    if (!dateObj || isNaN(dateObj.getTime())) continue;

                    const timeSec = Math.floor(dateObj.getTime() / 1000);
                    if (timeSec === null) continue;

                    // avoid duplicates (just in case)
                    const exists = parsed.some(d => d.time === timeSec);
                    if (exists) continue;

                    parsed.push({
                        time: timeSec,
                        open: open,
                        high: high,
                        low: low,
                        close: close,
                        date: dateObj
                    });
                }

                parsed.sort((a, b) => a.time - b.time);
                return parsed;
            }

            // ---------- load CSV file using PapaParse ----------
            async function loadCSV(filePath) {
                // if already cached, return
                if (dataCache.has(filePath)) {
                    return dataCache.get(filePath);
                }

                try {
                    loadStatusEl.textContent = `⏳ fetching ${filePath}…`;
                    loadStatusEl.style.color = '#8fb0d0';

                    const response = await fetch(filePath);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: Could not load ${filePath}`);
                    }

                    const csvText = await response.text();

                    // Use PapaParse to parse CSV with header detection
                    const result = Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        trimHeaders: true,
                        dynamicTyping: false // we'll parse manually
                    });

                    if (result.errors && result.errors.length > 0) {
                        console.warn('CSV parsing warnings:', result.errors);
                    }

                    const rows = result.data.filter(row => {
                        // filter out completely empty rows
                        return Object.values(row).some(v => v !== undefined && v !== null && v !== '');
                    });

                    if (rows.length === 0) {
                        throw new Error('No data rows found in ' + filePath);
                    }

                    const parsed = parseRows(rows);
                    if (parsed.length === 0) {
                        throw new Error('No valid OHLC rows after parsing ' + filePath);
                    }

                    dataCache.set(filePath, parsed);
                    return parsed;
                } catch (err) {
                    console.error('CSV load error:', err);
                    loadStatusEl.textContent = `⚠️ ${err.message}`;
                    loadStatusEl.style.color = '#e6b88a';
                    return null;
                }
            }

            // ---------- render chart with Plotly ----------
            function renderChart(data) {
                if (!data || data.length === 0) {
                    loadStatusEl.textContent = '⚠️ no data';
                    candleCountEl.textContent = '0';
                    dateRangeEl.textContent = '—';
                    return;
                }

                // Prepare data for Plotly - using numeric index to remove gaps
                const index = data.map((_, i) => i);
                const dates = data.map(d => d.date);
                const openPrices = data.map(d => d.open);
                const highPrices = data.map(d => d.high);
                const lowPrices = data.map(d => d.low);
                const closePrices = data.map(d => d.close);

                // Create custom tick labels with date and time
                const tickLabels = dates.map(d => {
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    const hours = String(d.getHours()).padStart(2, '0');
                    const minutes = String(d.getMinutes()).padStart(2, '0');
                    return `${month}/${day} ${hours}:${minutes}`;
                });

                // Candlestick trace
                const trace = {
                    type: 'candlestick',
                    x: index,
                    open: openPrices,
                    high: highPrices,
                    low: lowPrices,
                    close: closePrices,
                    increasing: {
                        line: { color: '#26a69a' },
                        fillcolor: '#26a69a'
                    },
                    decreasing: {
                        line: { color: '#ef5350' },
                        fillcolor: '#ef5350'
                    },
                    name: 'OHLC',
                    hovertext: tickLabels,
                    hovertemplate: '<b>%{hovertext}</b><br>' +
                        'Open: %{open:.4f}<br>' +
                        'High: %{high:.4f}<br>' +
                        'Low: %{low:.4f}<br>' +
                        'Close: %{close:.4f}<extra></extra>'
                };

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: {
                        color: '#b2c9e0',
                        family: 'system-ui, -apple-system, sans-serif'
                    },
                    xaxis: {
                        title: {
                            text: 'Date/Time',
                            font: { color: '#b2c9e0' }
                        },
                        gridcolor: '#1f2b36',
                        zerolinecolor: '#1f2b36',
                        color: '#b2c9e0',
                        rangeslider: { visible: false },
                        tickmode: 'array',
                        tickvals: index,
                        ticktext: tickLabels,
                        tickangle: -45,
                        showspikes: true,
                        spikemode: 'across',
                        spikethickness: 1,
                        spikecolor: '#4d6a89',
                        tickfont: { size: 10 }
                    },
                    yaxis: {
                        title: {
                            text: 'Price',
                            font: { color: '#b2c9e0' }
                        },
                        gridcolor: '#1f2b36',
                        zerolinecolor: '#1f2b36',
                        color: '#b2c9e0',
                        side: 'right'
                    },
                    margin: {
                        l: 60,
                        r: 20,
                        t: 20,
                        b: 80
                    },
                    hovermode: 'x unified',
                    showlegend: false,
                    dragmode: 'zoom',
                    modebar: {
                        bgcolor: 'rgba(13, 19, 27, 0.8)',
                        color: '#b2c9e0',
                        activecolor: '#6b8bb0'
                    }
                };

                const config = {
                    responsive: true,
                    displayModeBar: true,
                    modeBarButtonsToRemove: ['lasso2d', 'select2d', 'autoScale2d'],
                    displaylogo: false
                };

                Plotly.newPlot(container, [trace], layout, config);

                // Update info
                candleCountEl.textContent = data.length;
                if (data.length > 0) {
                    const first = data[0].date;
                    const last = data[data.length - 1].date;
                    dateRangeEl.textContent = `${formatDate(first)} → ${formatDate(last)}`;
                }

                loadStatusEl.textContent = '✅ ready';
                loadStatusEl.style.color = '#8fb0d0';
            }

            function formatDate(date) {
                return date.toISOString().slice(0, 10);
            }

            // ---------- change time frame (load CSV and render) ----------
            async function changeTimeFrame(rangeKey) {
                currentRange = rangeKey;

                // Update active button
                timeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.range === rangeKey);
                });

                const filePath = fileMap[rangeKey];
                if (!filePath) {
                    loadStatusEl.textContent = '⚠️ unknown range';
                    return;
                }

                loadStatusEl.textContent = `⏳ loading ${filePath}…`;
                loadStatusEl.style.color = '#8fb0d0';

                const data = await loadCSV(filePath);
                if (data && data.length > 0) {
                    renderChart(data);
                } else {
                    loadStatusEl.textContent = `⚠️ no data in ${filePath}`;
                    loadStatusEl.style.color = '#e6b88a';
                    candleCountEl.textContent = '0';
                    dateRangeEl.textContent = '—';
                }
            }

            // ---------- handle resize ----------
            function handleResize() {
                if (container && container.clientWidth > 0) {
                    Plotly.Plots.resize(container);
                }
            }

            // ---------- init ----------
            async function init() {
                // Set up button listeners
                timeButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const range = btn.dataset.range;
                        changeTimeFrame(range);
                    });
                });

                // load default: 1m
                await changeTimeFrame('1m');
            }

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(handleResize, 200);
            });

            init();
        })();
    </script>
</body>
</html>
