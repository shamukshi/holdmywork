<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HoldMyWork · OHLC</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f14;
            color: #d1d9e6;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px 20px 20px 20px;
            overflow: hidden;
        }

        .app-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 16px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .brand h1 {
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            color: #eef3fa;
            background: linear-gradient(145deg, #eef3fa 0%, #b0c8e0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand small {
            font-size: 0.9rem;
            font-weight: 300;
            color: #8b9bb5;
            margin-left: 4px;
            letter-spacing: 0.2px;
            -webkit-text-fill-color: #8b9bb5;
        }

        .sub-message {
            font-size: 0.95rem;
            color: #a2b7d0;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #2a3440;
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }

        .chart-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .time-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .time-buttons button {
            background: transparent;
            border: 1px solid #2d3a48;
            color: #b6c9e0;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.3px;
            background: #141c26;
        }

        .time-buttons button:hover {
            background: #25313f;
            border-color: #5b748f;
            color: #f0f7ff;
        }

        .time-buttons button.active {
            background: #2b3d52;
            border-color: #6b8bb0;
            color: #ffffff;
            box-shadow: 0 0 6px rgba(70, 130, 200, 0.2);
        }

        .info-badge {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 18px;
            margin-left: auto;
            font-size: 0.75rem;
            color: #8499b3;
            background: #121b24;
            padding: 4px 16px 4px 14px;
            border-radius: 40px;
            border: 1px solid #25323f;
        }

        .info-badge span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .info-badge .num {
            color: #d6e5f8;
            font-weight: 500;
        }

        .chart-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            background: #0d131b;
            border-radius: 20px;
            border: 1px solid #202b36;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            padding: 8px;
            position: relative;
            transition: all 0.1s;
        }

        #chart-container {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            background: #0d131b;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px 12px 12px 12px;
            }
            .brand h1 {
                font-size: 1.4rem;
            }
            .sub-message {
                font-size: 0.75rem;
                padding: 2px 10px;
            }
            .info-badge {
                font-size: 0.65rem;
                padding: 2px 10px;
            }
            .time-buttons button {
                font-size: 0.6rem;
                padding: 2px 10px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1e2833;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a5068;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <h1>holdmywork</h1>
            <small>⚡</small>
        </div>
        <div class="sub-message">
            Tak care of my work while I go do something else.
        </div>
    </header>

    <div class="chart-controls">
        <div class="time-buttons" id="timeButtons">
            <button data-range="1D">1D</button>
            <button data-range="1W">1W</button>
            <button data-range="1M" class="active">1M</button>
            <button data-range="3M">3M</button>
            <button data-range="1Y">1Y</button>
            <button data-range="ALL">All</button>
        </div>
        <div class="info-badge" id="infoBadge">
            <span>📄 <span class="num" id="candleCount">—</span> candles</span>
            <span>📅 <span id="dateRange">—</span></span>
            <span id="loadStatus" style="color:#8fb0d0;">⏳ loading…</span>
        </div>
    </div>

    <div class="chart-wrapper">
        <div id="chart-container"></div>
    </div>

    <script>
        (function() {
            "use strict";

            const container = document.getElementById('chart-container');
            const candleCountEl = document.getElementById('candleCount');
            const dateRangeEl = document.getElementById('dateRange');
            const loadStatusEl = document.getElementById('loadStatus');
            const timeButtons = document.querySelectorAll('#timeButtons button');

            let chart = null;
            let candlestickSeries = null;
            let ohlcData = [];
            let visibleRange = '1M';

            // ---------- SAMPLE DATA (your 6 rows) ----------
            const SAMPLE_DATA = [
                { time: new Date('2020-01-01 09:15:00').getTime() / 1000, open: 100, high: 100, low: 100, close: 100.0214737 },
                { time: new Date('2020-01-01 10:15:00').getTime() / 1000, open: 99.70423011, high: 99.50707164, low: 99.87286936, close: 99.93589005 },
                { time: new Date('2020-01-01 11:15:00').getTime() / 1000, open: 99.61954718, high: 99.39207048, low: 99.82229719, close: 100.04746 },
                { time: new Date('2020-01-01 12:15:00').getTime() / 1000, open: 99.71834394, high: 99.43349563, low: 99.77048017, close: 99.88671835 },
                { time: new Date('2020-01-01 13:15:00').getTime() / 1000, open: 99.56293679, high: 99.44586135, low: 99.83894711, close: 99.90803646 },
                { time: new Date('2020-01-01 14:15:00').getTime() / 1000, open: 99.57844649, high: 99.29855476, low: 99.78152824, close: 99.9113042 }
            ];

            // Try to load Excel, but fallback to sample data if it fails
            async function loadExcel() {
                try {
                    loadStatusEl.textContent = '⏳ loading Excel…';
                    
                    const response = await fetch('data/ohlc.xlsx');
                    
                    if (!response.ok) {
                        console.warn('Excel file not found, using sample data');
                        loadStatusEl.textContent = '📊 using sample data';
                        return SAMPLE_DATA;
                    }
                    
                    const arrayBuffer = await response.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: false });
                    
                    let sheetName = 'tab_1';
                    if (!workbook.SheetNames.includes(sheetName)) {
                        sheetName = workbook.SheetNames[0];
                    }
                    
                    const firstSheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: null });

                    if (!rows || rows.length === 0) {
                        console.warn('No data in Excel, using sample data');
                        loadStatusEl.textContent = '📊 using sample data';
                        return SAMPLE_DATA;
                    }

                    const headers = Object.keys(rows[0]);
                    const lowerMap = {};
                    headers.forEach(h => { lowerMap[h.trim().toLowerCase()] = h; });

                    const dateCol = lowerMap['date'] || lowerMap['timestamp'] || lowerMap['time'] || null;
                    const openCol = lowerMap['open_norm'] || lowerMap['open'] || null;
                    const highCol = lowerMap['high_norm'] || lowerMap['high'] || null;
                    const lowCol = lowerMap['low_norm'] || lowerMap['low'] || null;
                    const closeCol = lowerMap['close_norm'] || lowerMap['close'] || null;

                    if (!dateCol || !openCol || !highCol || !lowCol || !closeCol) {
                        console.warn('Columns not found in Excel, using sample data');
                        loadStatusEl.textContent = '📊 using sample data';
                        return SAMPLE_DATA;
                    }

                    const parsed = [];
                    for (const row of rows) {
                        const rawDate = row[dateCol];
                        const open = parseFloat(row[openCol]);
                        const high = parseFloat(row[highCol]);
                        const low = parseFloat(row[lowCol]);
                        const close = parseFloat(row[closeCol]);

                        if (rawDate === undefined || rawDate === null) continue;
                        if ([open, high, low, close].some(v => isNaN(v) || !isFinite(v))) continue;

                        let dateObj;
                        if (typeof rawDate === 'number') {
                            const epoch = new Date(1899, 11, 30);
                            dateObj = new Date(epoch.getTime() + rawDate * 86400000);
                        } else {
                            dateObj = new Date(rawDate);
                        }
                        
                        if (!dateObj || isNaN(dateObj.getTime())) continue;

                        const timeSec = Math.floor(dateObj.getTime() / 1000);
                        if (timeSec === null) continue;

                        parsed.push({
                            time: timeSec,
                            open: open,
                            high: high,
                            low: low,
                            close: close
                        });
                    }

                    if (parsed.length === 0) {
                        console.warn('No valid rows in Excel, using sample data');
                        loadStatusEl.textContent = '📊 using sample data';
                        return SAMPLE_DATA;
                    }

                    parsed.sort((a, b) => a.time - b.time);
                    loadStatusEl.textContent = '✅ Excel loaded';
                    return parsed;
                } catch (err) {
                    console.warn('Error loading Excel, using sample data:', err);
                    loadStatusEl.textContent = '📊 using sample data';
                    return SAMPLE_DATA;
                }
            }

            // ---------- aggregation ----------
            function roundToInterval(timeSec, intervalSeconds) {
                return Math.floor(timeSec / intervalSeconds) * intervalSeconds;
            }

            function aggregateCandles(data, intervalSeconds) {
                if (!data || data.length === 0) return [];
                if (intervalSeconds <= 0) return data.slice();

                const buckets = new Map();
                for (const d of data) {
                    const bucketKey = roundToInterval(d.time, intervalSeconds);
                    if (!buckets.has(bucketKey)) {
                        buckets.set(bucketKey, {
                            time: bucketKey,
                            open: d.open,
                            high: d.high,
                            low: d.low,
                            close: d.close,
                        });
                    } else {
                        const b = buckets.get(bucketKey);
                        b.high = Math.max(b.high, d.high);
                        b.low = Math.min(b.low, d.low);
                        b.close = d.close;
                    }
                }

                const result = Array.from(buckets.values());
                result.sort((a, b) => a.time - b.time);
                return result;
            }

            // ---------- render chart ----------
            function renderChart(data) {
                if (!data || data.length === 0) {
                    loadStatusEl.textContent = '⚠️ no data';
                    return;
                }

                console.log('Rendering', data.length, 'candles');

                if (chart) {
                    chart.remove();
                    chart = null;
                    candlestickSeries = null;
                }

                chart = LightweightCharts.createChart(container, {
                    layout: {
                        background: { color: '#0d131b' },
                        textColor: '#b2c9e0',
                    },
                    grid: {
                        vertLines: { color: '#1f2b36' },
                        horzLines: { color: '#1f2b36' },
                    },
                    crosshair: {
                        mode: LightweightCharts.CrosshairMode.Normal,
                        vertLine: {
                            color: '#4d6a89',
                            width: 1,
                            style: LightweightCharts.LineStyle.Dashed,
                        },
                        horzLine: {
                            color: '#4d6a89',
                            width: 1,
                            style: LightweightCharts.LineStyle.Dashed,
                        },
                    },
                    rightPriceScale: {
                        borderColor: '#2a3a4a',
                        scaleMargins: { top: 0.05, bottom: 0.05 },
                    },
                    timeScale: {
                        borderColor: '#2a3a4a',
                        timeVisible: true,
                        secondsVisible: false,
                    },
                    handleScroll: { mouseWheel: true, pressedMouseMove: true },
                    handleScale: { mouseWheel: true, pinch: true },
                    width: container.clientWidth,
                    height: container.clientHeight,
                });

                candlestickSeries = chart.addCandlestickSeries({
                    upColor: '#4caf84',
                    downColor: '#e2636b',
                    borderDownColor: '#c84c54',
                    borderUpColor: '#3e9b77',
                    wickUpColor: '#6abf9a',
                    wickDownColor: '#d97a82',
                });

                const chartData = data.map(d => ({
                    time: d.time,
                    open: d.open,
                    high: d.high,
                    low: d.low,
                    close: d.close,
                }));
                candlestickSeries.setData(chartData);

                candleCountEl.textContent = data.length;
                if (data.length > 0) {
                    const first = new Date(data[0].time * 1000);
                    const last = new Date(data[data.length - 1].time * 1000);
                    dateRangeEl.textContent = `${formatDate(first)} → ${formatDate(last)}`;
                }

                applyRange(visibleRange);

                const resizeObserver = new ResizeObserver(() => {
                    if (chart) {
                        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
                    }
                });
                resizeObserver.observe(container);

                loadStatusEl.textContent = '✅ ready';
                loadStatusEl.style.color = '#8fb0d0';
            }

            function formatDate(date) {
                return date.toISOString().slice(0, 10);
            }

            // ---------- range ----------
            function getAggregationInterval(rangeKey, data) {
                if (!data || data.length < 2) return 0;
                const first = data[0];
                const second = data[1] || data[0];
                const rawInterval = Math.abs(second.time - first.time);
                if (rawInterval === 0) return 0;

                switch (rangeKey) {
                    case '1D':
                        return rawInterval;
                    case '1W':
                        return Math.max(rawInterval, 3600);
                    case '1M':
                        return Math.max(rawInterval, 3600 * 4);
                    case '3M':
                        return Math.max(rawInterval, 3600 * 8);
                    case '1Y':
                        return Math.max(rawInterval, 86400);
                    case 'ALL':
                        return Math.max(rawInterval, 86400 * 2);
                    default:
                        return 0;
                }
            }

            function applyRange(rangeKey) {
                if (!chart || !ohlcData.length) return;

                const rawData = ohlcData;
                const interval = getAggregationInterval(rangeKey, rawData);
                let displayData = rawData;

                if (interval > 0) {
                    displayData = aggregateCandles(rawData, interval);
                }

                if (candlestickSeries) {
                    const chartData = displayData.map(d => ({
                        time: d.time,
                        open: d.open,
                        high: d.high,
                        low: d.low,
                        close: d.close,
                    }));
                    candlestickSeries.setData(chartData);
                    candleCountEl.textContent = displayData.length;
                    if (displayData.length > 0) {
                        const first = new Date(displayData[0].time * 1000);
                        const last = new Date(displayData[displayData.length - 1].time * 1000);
                        dateRangeEl.textContent = `${formatDate(first)} → ${formatDate(last)}`;
                    }
                }

                const last = displayData[displayData.length - 1];
                const first = displayData[0];
                const lastTime = last.time;
                let fromTime = first.time;
                const now = new Date(lastTime * 1000);

                switch (rangeKey) {
                    case '1D': {
                        const d = new Date(now);
                        d.setDate(d.getDate() - 1);
                        fromTime = Math.floor(d.getTime() / 1000);
                        break;
                    }
                    case '1W': {
                        const d = new Date(now);
                        d.setDate(d.getDate() - 7);
                        fromTime = Math.floor(d.getTime() / 1000);
                        break;
                    }
                    case '1M': {
                        const d = new Date(now);
                        d.setMonth(d.getMonth() - 1);
                        fromTime = Math.floor(d.getTime() / 1000);
                        break;
                    }
                    case '3M': {
                        const d = new Date(now);
                        d.setMonth(d.getMonth() - 3);
                        fromTime = Math.floor(d.getTime() / 1000);
                        break;
                    }
                    case '1Y': {
                        const d = new Date(now);
                        d.setFullYear(d.getFullYear() - 1);
                        fromTime = Math.floor(d.getTime() / 1000);
                        break;
                    }
                    case 'ALL':
                    default:
                        fromTime = first.time;
                        break;
                }

                if (fromTime < first.time) fromTime = first.time;
                if (fromTime > lastTime) fromTime = first.time;

                chart.timeScale().setVisibleRange({
                    from: fromTime,
                    to: lastTime,
                });

                timeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.range === rangeKey);
                });
                visibleRange = rangeKey;
            }

            // ---------- init ----------
            async function init() {
                timeButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const range = btn.dataset.range;
                        applyRange(range);
                    });
                });

                const data = await loadExcel();
                ohlcData = data;
                if (data && data.length > 0) {
                    renderChart(data);
                } else {
                    loadStatusEl.textContent = '⚠️ no data loaded';
                    loadStatusEl.style.color = '#e6b88a';
                }
            }

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (chart) {
                        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
                    }
                }, 80);
            });

            init();
        })();
    </script>
</body>
</html>
