<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoldMyWork · autopilot for your work</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f7fafd;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 1.5rem;
        }

        .card {
            max-width: 620px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            padding: 3rem 2.5rem;
            box-shadow: 0 15px 35px -10px rgba(0, 20, 50, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.02);
            text-align: center;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0a2540;
            margin-bottom: 0.75rem;
            line-height: 1.2;
        }

        .tagline {
            font-size: 1.25rem;
            color: #425b76;
            margin-bottom: 2.5rem;
            font-weight: 400;
            line-height: 1.5;
        }

        .tagline strong {
            font-weight: 600;
            color: #0a2540;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: #0a2540;
            color: #ffffff;
            font-weight: 600;
            font-size: 1.15rem;
            padding: 1rem 2.5rem;
            border-radius: 100px;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 20px -8px rgba(10, 37, 64, 0.3);
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            background: #143d66;
            transform: translateY(-2px);
            box-shadow: 0 14px 25px -8px rgba(10, 37, 64, 0.4);
        }

        .download-btn:active {
            transform: translateY(0);
            box-shadow: 0 6px 15px -6px rgba(10, 37, 64, 0.3);
        }

        .download-btn .icon {
            font-size: 1.3rem;
            line-height: 1;
        }

        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .tagline {
                font-size: 1.05rem;
                margin-bottom: 2rem;
            }

            .download-btn {
                font-size: 1rem;
                padding: 0.9rem 1.8rem;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>HoldMyWork</h1>
        <p class="tagline">…a place where you can create an <strong>autopilot for your work</strong></p>
        <a
            class="download-btn"
            href="https://github.com/shamukshi/holdmywork/raw/refs/heads/main/form.zip"
            download="form.zip"
        >
            <span class="icon">⬇</span>
            Download HoldMyWork
        </a>
    </div>
</body>
</html>
